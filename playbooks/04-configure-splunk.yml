---
# Configure Splunk server (receiver + base configuration)
- name: Configure Splunk server
  hosts: monitoring
  become: true
  gather_facts: false

  pre_tasks:
    - name: Load global vault (best effort)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
      failed_when: false
      no_log: true
      become: false

    - name: Load host vault (best effort)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
      failed_when: false
      no_log: true
      become: false

    - name: Pin become password for this host (so sudo always works)
      ansible.builtin.set_fact:
        ansible_become_password: >-
          {{ vault_os_become_password
             | default(vault_os_become_initial_password
             | default(vault_default_password)) }}
        ansible_become_pass: "{{ ansible_become_password }}"
      no_log: true
      become: false

  roles:
    - splunk_configure
    - splunk_content
    - splunk_harden
