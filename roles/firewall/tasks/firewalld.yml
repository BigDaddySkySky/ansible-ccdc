---
# ============================================
# FIREWALLD CONFIGURATION (RHEL/Fedora)
# ============================================
# Critical-path safe:
# - Does NOT change default zone
# - Does NOT remove existing services
# - Only configures firewalld if it's already running OR you explicitly opt-in to start it
# ============================================

- name: Install firewalld (Fedora/RHEL) via dnf CLI
  ansible.builtin.raw: dnf install -y firewalld
  become: true
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: Check firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state
  changed_when: false
  failed_when: false
  become: true

- name: Set firewalld_running fact
  ansible.builtin.set_fact:
    firewalld_running: "{{ (firewalld_state.stdout | default('')) == 'running' }}"

# Only start/enable firewalld if explicitly requested
- name: Ensure firewalld is enabled and started (optional)
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true
  when: firewall_manage_firewalld_service | default(false) | bool

# Re-check after optional start
- name: Re-check firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state_after
  changed_when: false
  failed_when: false
  become: true
  when: firewall_manage_firewalld_service | default(false) | bool

- name: Update firewalld_running fact (post-start)
  ansible.builtin.set_fact:
    firewalld_running: "{{ (firewalld_state_after.stdout | default(firewalld_state.stdout | default(''))) == 'running' }}"
  when: firewall_manage_firewalld_service | default(false) | bool

# If it's not running and we aren't managing it, skip cleanly
- name: Skip firewalld configuration (service not running)
  ansible.builtin.debug:
    msg: "ℹ️ firewalld not running and firewall_manage_firewalld_service=false; skipping firewalld configuration"
  when:
    - not firewalld_running
    - not (firewall_manage_firewalld_service | default(false) | bool)

# ============================================
# Determine Effective Zone (do NOT change zones in critical path)
# ============================================

- name: Get default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: default_zone
  changed_when: false
  failed_when: false
  become: true
  when: firewalld_running

- name: Set effective zone fact
  ansible.builtin.set_fact:
    firewalld_effective_zone: "{{ default_zone.stdout | default(firewalld_default_zone) }}"
  when: firewalld_running

- name: Display effective zone
  ansible.builtin.debug:
    msg: "✅ Effective zone: {{ firewalld_effective_zone }}"
  when: firewalld_running

# ============================================
# Allow Scored Services
# ============================================

- name: Allow scored services (by port)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    port: "{{ item.port }}/{{ item.proto }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_scored_services }}"
  become: true
  when: firewalld_running

- name: Display allowed scored services
  ansible.builtin.debug:
    msg: "  • {{ item.name }} ({{ item.port }}/{{ item.proto }})"
  loop: "{{ firewall_scored_services }}"
  when: firewalld_running

# ============================================
# Allow Additional Services (host-specific)
# ============================================

- name: Allow additional services
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    port: "{{ item.port }}/{{ item.proto }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_additional_services }}"
  become: true
  when:
    - firewalld_running
    - firewall_additional_services | length > 0

# ============================================
# Allow from Scoring Engine IPs (optional)
# ============================================

- name: Allow all traffic from scoring engine IPs (optional)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_scoring_ips }}"
  become: true
  when:
    - firewalld_running
    - firewall_allow_all_from_scoring_ips | bool
    - firewall_scoring_ips | length > 0

- name: Display scoring IP allowances
  ansible.builtin.debug:
    msg:
      - "Allowed scoring IPs:"
      - "{{ firewall_scoring_ips | map('regex_replace', '^(.*)$', '  • \\1') | list }}"
  when:
    - firewalld_running
    - firewall_allow_all_from_scoring_ips | bool
    - firewall_scoring_ips | length > 0

# ============================================
# Rate Limiting (optional)
# ============================================

- name: Enable SSH rate limiting with rich rule (optional)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    rich_rule: 'rule service name="ssh" limit value="{{ firewall_ssh_rate_limit }}" accept'
    state: enabled
    permanent: true
    immediate: true
  become: true
  when:
    - firewalld_running
    - firewall_enable_rate_limiting | bool

- name: Display rate limiting status
  ansible.builtin.debug:
    msg: "{{ '✅ Rate limiting enabled for SSH (' ~ firewall_ssh_rate_limit ~ ')' if firewall_enable_rate_limiting else 'ℹ️  Rate limiting disabled' }}"
  when: firewalld_running

# ============================================
# Logging Configuration (optional)
# ============================================

- name: Configure firewalld logging (runtime)
  ansible.builtin.command: "firewall-cmd --set-log-denied={{ 'all' if firewall_log_denied else 'off' }}"
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  changed_when: true
  become: true

- name: Make firewalld logging configuration permanent
  ansible.builtin.command: "firewall-cmd --runtime-to-permanent"
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  changed_when: true
  become: true

- name: Reload firewalld to apply logging changes
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  become: true

- name: Display logging status
  ansible.builtin.debug:
    msg: "{{ '✅ Logging enabled' if firewall_enable_logging else 'ℹ️  Logging disabled' }}"
  when: firewalld_running

# ============================================
# Verify Configuration
# ============================================

- name: Get active zones
  ansible.builtin.command: firewall-cmd --get-active-zones
  register: active_zones
  changed_when: false
  failed_when: false
  become: true
  when: firewalld_running

- name: Get firewalld configuration (effective zone)
  ansible.builtin.command: "firewall-cmd --zone={{ firewalld_effective_zone }} --list-all"
  register: firewalld_config
  changed_when: false
  failed_when: false
  become: true
  when: firewalld_running

- name: Display firewalld configuration
  ansible.builtin.debug:
    msg: "{{ firewalld_config.stdout_lines }}"
  when: firewalld_running

- name: Display firewalld configuration summary
  ansible.builtin.debug:
    msg:
      - ""
      - "Firewalld configuration complete:"
      - "  • Running: {{ firewalld_running }}"
      - "  • Effective zone: {{ firewalld_effective_zone | default(firewalld_default_zone) }}"
      - "  • Scored ports allowed: {{ firewall_scored_services | length }}"
      - "{{ '  • Rate limiting: SSH (' ~ firewall_ssh_rate_limit ~ ')' if firewall_enable_rate_limiting else '  • Rate limiting: OFF' }}"
      - "{{ '  • Logging: ENABLED' if firewall_enable_logging else '  • Logging: OFF' }}"
  when: firewalld_running
