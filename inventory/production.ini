###############################################
# PRODUCTION ENVIRONMENT (Competition Network)
# Populate with real IPs day-of; structure mirrors staging.ini
###############################################

[linux_servers]
ubuntu_ecom_vm    ansible_host=172.20.242.104
fedora_webmail_vm ansible_host=172.20.242.101
splunk_vm         ansible_host=172.20.242.20
# ubuntu_wkst_vm  ansible_host=127.0.0.1

[linux_servers:vars]
ansible_user=sysadmin
ansible_python_interpreter=/usr/bin/python3
# ansible_password={{ vault_host_password }}
# ansible_become_password={{ vault_host_password }}

###############################################
# PRIORITY GROUPS (for targeted execution)
###############################################

[critical_services]
ubuntu_ecom_vm
fedora_webmail_vm
splunk_vm

[scoring_services]
ubuntu_ecom_vm
fedora_webmail_vm
splunk_vm

[web_servers]
ubuntu_ecom_vm
fedora_webmail_vm

[mail_servers]
fedora_webmail_vm

[database_servers]
ubuntu_ecom_vm
fedora_webmail_vm

[monitoring]
splunk_vm

[palo_firewalls]
palo_vm ansible_host=REPLACE_WITH_IP

###############################################
# GLOBAL VARIABLES
###############################################

[all:vars]
staging_environment=false
team_number=REPLACE_TEAM_NUMBER
competition_name=MWCCDC2025
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_timeout=10
