# ============================================
# STAGING ENVIRONMENT (VMware VMs)
# ============================================
# Update IPs after creating VMs (see docs/VM-SETUP.md)
# ============================================

[linux_servers]
# TODO: Update these IPs after VM creation
# To find VM IP: login to VM console, run: ip addr show
ubuntu_ecom_vm ansible_host=192.168.XXX.XXX
# fedora_webmail_vm ansible_host=192.168.XXX.XXX  # Sprint 1+
# splunk_vm ansible_host=192.168.XXX.XXX          # Sprint 2+

[linux_servers:vars]
ansible_user=ccdc
ansible_password=changeme
ansible_become_password=changeme
ansible_python_interpreter=/usr/bin/python3

[all:vars]
# Flag to indicate this is staging (not competition)
staging_environment=true

# SSH settings (don't verify host keys for VMs)
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Connection timeout (detect unreachable hosts faster)
ansible_timeout=10

# Competition metadata (for testing)
team_number=99
competition_name=MWCCDC2025-STAGING