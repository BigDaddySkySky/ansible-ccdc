---
# ============================================
# PASSWORD ROTATION PLAYBOOK - (SPRINT 4 FIX)
# ============================================
# Purpose: Change passwords from "changeme" to unique vault passwords
# Runtime: 1-2 minutes
# Prerequisites:
#   - SSH key authentication working
#   - Vault files encrypted
#   - vault_default_password and vault_host_password defined
# ============================================

- name: Password Rotation - Pre-Flight Checks
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Display rotation header
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   PASSWORD ROTATION - PRE-FLIGHT         ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "⚠️  WARNING: This will change passwords on target hosts!"
          - ""
          - "Targets: {{ groups['all'] | join(', ') }}"
          - ""

    - name: Verify vault password file exists
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.vault_pass"
      register: vault_file

    - name: Display vault status
      ansible.builtin.debug:
        msg: "{{ '✅ Vault password file found' if vault_file.stat.exists else '❌ Vault password file missing' }}"

    - name: Fail if vault password file missing
      ansible.builtin.fail:
        msg: "Vault password file not found at ~/.vault_pass"
      when: not vault_file.stat.exists

    - name: Pause for confirmation
      ansible.builtin.pause:
        prompt: "Competition safety gate: Press ENTER to proceed with password rotation, or Ctrl+C to abort"
      when: confirm is not defined or confirm != "yes"

- name: Password Rotation - Verify current access before competition change
  hosts: all
  gather_facts: false
  ignore_unreachable: true

  pre_tasks:
    - name: Load vault variables for old password
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../group_vars/all/vault.yml"
        - "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
      failed_when: false

    - name: Set BECOME password to the DEFAULT (old) password
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_default_password }}"

  tasks:
    - name: Verify SSH availability
      ansible.builtin.ping:
      register: ping_test

    - name: Verify sudo access for competition (with OLD password)
      ansible.builtin.command: whoami
      become: true
      changed_when: false
      register: sudo_test
      when: ping_test is success

    - name: Display host status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "SSH: {{ '✅ Connected' if ping_test is success else '❌ Failed' }}"
          - "Sudo (with default pass): {{ '✅ Working' if (sudo_test is defined and sudo_test.stdout == 'root') else '❌ Failed' }}"
      when: ping_test is success or ping_test is failed

- name: Password Rotation - Change Passwords
  hosts: all
  gather_facts: false
  ignore_unreachable: true

  pre_tasks:
    - name: Load vault variables for old password
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../group_vars/all/vault.yml"
        - "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
      failed_when: false

    - name: Set BECOME password to the DEFAULT (old) password
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_default_password }}"

  tasks:
    - name: Verify variables loaded
      ansible.builtin.debug:
        msg: "Variables loaded - vault_default_password: {{ 'defined' if vault_default_password is defined else 'MISSING' }}, vault_host_password: {{ 'defined' if vault_host_password is defined else 'MISSING' }}"

    - name: Display password change plan
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Host: {{ inventory_hostname }}"
          - "User: {{ ansible_user }}"
          - "Action: Changing password to unique vault password"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: Change user password
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        password: "{{ vault_host_password | password_hash('sha512') }}"
        update_password: always
      become: true
      register: password_change

    - name: Mark password as changed
      ansible.builtin.set_fact:
        password_rotated: true
      when: password_change is success

    - name: Display change result
      ansible.builtin.debug:
        msg: "✅ Password changed successfully for {{ ansible_user }}@{{ inventory_hostname }}"
      when: password_change is success

    - name: Display change failure
      ansible.builtin.debug:
        msg: "❌ Password change failed for {{ ansible_user }}@{{ inventory_hostname }}"
      when: password_change is failed

- name: Password Rotation - Verify new passwords for competition continuity
  hosts: all
  gather_facts: false
  ignore_unreachable: true

  pre_tasks:
    - name: Load vault variables for new password
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../group_vars/all/vault.yml"
        - "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
      failed_when: false

    - name: Set BECOME password to the HOST (new) password
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_host_password }}"

  tasks:
    - name: Verify sudo with new password for competition continuity
      ansible.builtin.command: whoami
      become: true
      changed_when: false
      register: new_sudo_test
      failed_when: false

    - name: Mark validation as successful
      ansible.builtin.set_fact:
        password_validated: true
      when: new_sudo_test is success and new_sudo_test.stdout == "root"

    - name: Display validation result
      ansible.builtin.debug:
        msg: "{{ '✅ New password confirmed for competition on ' ~ inventory_hostname if password_validated is defined else '❌ Credential check failed for ' ~ inventory_hostname }}"

- name: Password Rotation - Summary
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    rotated_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('password_rotated', 'defined') | map(attribute='inventory_hostname') | list }}"
    validated_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('password_validated', 'defined') | map(attribute='inventory_hostname') | list }}"
    failed_hosts: "{{ groups['all'] | difference(validated_hosts) }}"

  tasks:
    - name: Calculate metrics
      ansible.builtin.set_fact:
        total_hosts: "{{ groups['all'] | length }}"
        success_count: "{{ validated_hosts | length }}"
        failure_count: "{{ failed_hosts | length }}"
        success_rate: "{{ ((validated_hosts | length / (groups['all'] | length | default(1))) * 100) | round(1) }}"

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   PASSWORD ROTATION COMPLETE             ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "Total hosts: {{ total_hosts }}"
          - "✅ Successful: {{ success_count }}"
          - "❌ Failed: {{ failure_count }}"
          - "Success rate: {{ success_rate }}%"
          - ""
          - "Successful hosts: {{ validated_hosts | join(', ') if validated_hosts else 'None' }}"
          - "{{ 'Failed hosts: ' ~ failed_hosts | join(', ') if failed_hosts else '' }}"
          - ""
          - "{{ '⚠️ IMPORTANT: Update group_vars/linux_servers/connection.yml' if success_count | int > 0 else '' }}"
          - "{{ 'Change ansible_become_password from vault_default_password to vault_host_password' if success_count | int > 0 else '' }}"

    - name: Send Discord notification
      ansible.builtin.uri:
        url: "{{ vault_discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: |
            🔐 **Password Rotation Complete**

            **Results:**
            • Total: {{ total_hosts }}
            • ✅ Success: {{ success_count }}
            • ❌ Failed: {{ failure_count }}
            • Rate: {{ success_rate }}%

            **Successful:** {{ validated_hosts | join(', ') if validated_hosts else 'None' }}
            {{ '**Failed:** ' ~ failed_hosts | join(', ') if failed_hosts else '' }}
        status_code: [200, 204]
      register: discord_result
      failed_when: false
      when:
        - vault_discord_webhook_url is defined
        - vault_discord_webhook_url != ""
        - "'YOUR_WEBHOOK' not in vault_discord_webhook_url"

    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - ""
          - "📋 NEXT STEPS:"
          - ""
          - "1. Update group_vars/linux_servers/connection.yml:"
          - "   Change: vault_default_password → vault_host_password"
          - ""
          - "2. Verify access with new passwords:"
           - "   ansible all -m command -a 'whoami' -b"
          - ""
          - "3. If you kept prep snapshots, capture a 'Post-rotation' snapshot in local prep"
          - ""
          - "4. Commit changes:"
          - "   git add -A"
          - "   git commit -m 'Sprint 2: Password rotation complete'"
          - "   git push origin v2-rebuild"
      when: success_count | int > 0

    - name: Fail if all hosts failed
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════╗
          ║   CRITICAL: ALL HOSTS FAILED             ║
          ╚══════════════════════════════════════════╝

          All password rotations failed!

          Troubleshooting:
          1. Revert to a prior local preparation snapshot
          2. Verify vault files: ansible-vault view host_vars/*/vault.yml
          3. Confirm variables: ansible all -m debug -a "var=vault_host_password"
      when: success_count | int == 0
