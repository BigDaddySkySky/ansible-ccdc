---
# ============================================
# CRITICAL PATH HARDENING PLAYBOOK (SPRINT 4.1)
# ============================================
# Purpose: Master playbook for full-stack competition hardening
# Runs: Pre-flight -> SSH -> Firewall -> Auditd -> Competition-safe checks & reporting
# ============================================

- name: 1. Pre-Flight Checks (Localhost)
  hosts: localhost
  gather_facts: true
  become: false

  tasks:
    - name: Display header
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   CRITICAL PATH HARDENING (SPRINT 4)     ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "⚠️  This will apply the FULL hardening stack:"
          - "  1. SSH Hardening"
          - "  2. Firewall Configuration"
          - "  3. Auditd Monitoring"
          - ""
          - "Targets: {{ groups['all'] | join(', ') }}"
          - "Prerequisites: Passwords rotated, SSH keys deployed"

    - name: Pause for confirmation
      ansible.builtin.pause:
        prompt: |

          ⚠️  LAST CHANCE TO ABORT!

          Competition safety gate before hardening.
          Have you captured snapshots during prior local preparation?
          Without those snapshots, you cannot rollback if locked out!

          Press ENTER to continue, or Ctrl+C to abort
      when: (confirm | default('no') | lower) != 'yes'

- name: 2. Apply Full Hardening Stack & Report Summary
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Load global secrets (repo or local)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
      no_log: true

    - name: Load host secrets (repo or local)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
      no_log: true

    - name: Ensure a become password is available
      ansible.builtin.assert:
        that:
          - (vault_host_password is defined and vault_host_password | length > 0) or
            (vault_default_password is defined and vault_default_password | length > 0)
        fail_msg: >
          Missing become password. Expected vault_host_password (host_vars/<host>/vault.yml)
          or vault_default_password (group_vars/all/vault.yml).
      no_log: true

    - name: Set ansible_become_password (prefer rotated)
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_host_password | default(vault_default_password) }}"
      no_log: true


  roles:
    - role: common_preflight
      tags: [always]

    - role: ssh_hardening
      tags: [ssh]

    - role: firewall
      tags: [firewall]

    - role: auditd
      tags: [auditd]

    - role: common_validation
      tags: [always]

  post_tasks:
    - name: Gather facts from localhost for timestamp
      ansible.builtin.setup:
      delegate_to: localhost
      run_once: true

    - name: Calculate Results
      ansible.builtin.set_fact:
        total_hosts_list: "{{ ansible_play_hosts_all }}"
        completed_hosts_list: "{{ ansible_play_hosts }}"
        missing_hosts_list: "{{ ansible_play_hosts_all | difference(ansible_play_hosts) }}"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Format Results
      ansible.builtin.set_fact:
        total_count: "{{ total_hosts_list | length }}"
        completed_count: "{{ completed_hosts_list | length }}"
        missing_count: "{{ missing_hosts_list | length }}"
        completed_string: "{{ completed_hosts_list | join(', ') }}"
        missing_string: "{{ missing_hosts_list | join(', ') }}"
      run_once: true
      delegate_to: localhost
      become: false

    - name: Send Discord notification
      ansible.builtin.include_role:
        name: common_notify
      vars:
        discord_title: "🛡️ Critical Path Hardening Complete"
        discord_description: |
          Full stack hardening (SSH, Firewall, Auditd) has been applied.

          **Total Hosts:** {{ total_count }}
          **✅ Completed:** {{ completed_count }}
          **❌ Missing:** {{ missing_count }}

          **Completed:** {{ completed_string if completed_string else 'None' }}
          **Missing:** {{ missing_string if missing_string else 'None' }}
        discord_color: "{{ '3066993' if missing_count == 0 else '15158332' }}"
        discord_webhook_effective: "{{ vault_discord_webhook_url | default(lookup('env','DISCORD_WEBHOOK_URL'), true) }}"
        discord_webhook_url: "{{ discord_webhook_effective }}"
      run_once: true
      when:
        - discord_webhook_effective is defined
        - discord_webhook_effective | length > 0
        - "'YOUR_WEBHOOK' not in discord_webhook_effective"


    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   CRITICAL PATH COMPLETE                 ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "Total hosts: {{ total_count }}"
          - "✅ Completed: {{ completed_count }}"
          - "❌ Missing: {{ missing_count }}"
          - ""
          - "Next steps:"
          - "  1. Verify scored services for adjudication (curl, telnet, etc.)"
          - "  2. Check audit logs: ansible all -m command -a 'ausearch -ts recent' -b"
          - "  3. If available from prior preparation, capture new snapshots: 'Post-Critical-Path'"
          - "  4. Commit changes: git commit -m 'Sprint 4: Critical path consolidated'"
      run_once: true
      delegate_to: localhost
      become: false
