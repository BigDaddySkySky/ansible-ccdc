---
# ============================================
# PLAYBOOK: BOOTSTRAP SSH KEYS
# ============================================
# Purpose: Deploys SSH keys to new VMs using their default passwords
# Replaces: scripts/setup-ssh-keys.sh
# Targets: [new_vms]
# ============================================

- name: Deploy SSH keys to new VMs
  hosts: new_vms
  gather_facts: false

  tasks:
    - name: Display bootstrap target
      ansible.builtin.debug:
        msg: "Bootstrapping SSH key onto {{ inventory_hostname }} using its default password."

    - name: Deploy SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/ccdc_rsa.pub') }}"
        state: present
      register: key_deploy

    - name: Display result
      ansible.builtin.debug:
        msg: "✅ SSH key successfully deployed to {{ inventory_hostname }}"
      when: key_deploy is changed

- name: Bootstrap Complete
  hosts: localhost
  gather_facts: false
  become: false
  
  tasks:
    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   SSH KEY BOOTSTRAP COMPLETE             ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "✅ SSH keys have been deployed to all hosts in the [new_vms] group."
          - ""
          - "⚠️  CRITICAL NEXT STEP:"
          - "   1. Open 'inventory/staging.ini'"
          - "   2. REMOVE the 'ansible_password=...' from the splunk_vm and ubuntu_wkst_vm lines."
          - ""
          - "After you remove the passwords, you can run the rest of the automation stack."
