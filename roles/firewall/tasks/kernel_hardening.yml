---
# ============================================
# KERNEL HARDENING FOR NETWORK SECURITY
# ============================================
# Configure Linux kernel parameters for DDoS protection
# ============================================

- name: Enable SYN cookies (SYN flood protection)
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Disable IP forwarding (not a router)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  become: true
  when: firewall_disable_ip_forwarding | default(false) | bool

- name: Disable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  become: true
  when: firewall_disable_ipv6_forwarding | default(false) | bool

- name: Enable source address verification (anti-spoofing)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: '2'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Disable ICMP redirect acceptance
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Disable secure ICMP redirect acceptance
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.secure_redirects
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Disable ICMP redirect sending
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.send_redirects
    value: '0'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Enable bad error message protection
  ansible.posix.sysctl:
    name: net.ipv4.icmp_ignore_bogus_error_responses
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Log martian packets (packets with impossible addresses)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.log_martians
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Display kernel hardening summary
  ansible.builtin.debug:
    msg:
      - "Kernel hardening applied:"
      - "  • SYN flood protection: ENABLED"
      - "  • IP forwarding: DISABLED"
      - "  • Source verification: ENABLED"
      - "  • ICMP redirects: DISABLED"
      - "  • Martian logging: ENABLED"
