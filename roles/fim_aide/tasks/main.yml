---
# ============================================
# FIM (AIDE) ROLE - TASKS
# ============================================
# Installs AIDE, writes a minimal authoritative config (no distro defaults),
# initializes DB idempotently, and schedules periodic checks + Discord alerts.
# Also writes forensic artifacts to /var/log/aide/ccdc for white team.
# ============================================

- name: FIM | End host early when disabled
  ansible.builtin.meta: end_host
  when: not (fim_aide_enabled | bool)

- name: FIM | Require fim_aide_paths to be defined and non-empty
  ansible.builtin.assert:
    that:
      - fim_aide_paths is defined
      - fim_aide_paths | length > 0
    fail_msg: "fim_aide_paths must be set per-host (tight scope). Do not monitor broad roots like '/' in competition."

# ----------------------------
# Install dependencies
# ----------------------------
- name: FIM | Install AIDE (Debian/Ubuntu)
  ansible.builtin.apt:
    name: aide
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: true

- name: FIM | Install AIDE (Fedora/RHEL/Oracle) via dnf CLI
  ansible.builtin.raw: dnf install -y aide
  when: ansible_os_family == "RedHat"
  become: true
  changed_when: "'Nothing to do' not in (stdout | default(''))"

- name: FIM | Ensure python3-requests installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name: python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  become: true

- name: FIM | Ensure python3-requests installed (Fedora/RHEL/Oracle) via dnf CLI
  ansible.builtin.raw: dnf install -y python3-requests
  when: ansible_os_family == "RedHat"
  become: true
  changed_when: "'Nothing to do' not in (stdout | default(''))"

# ----------------------------
# Ensure dirs exist
# ----------------------------
- name: FIM | Ensure AIDE config parent directory exists
  ansible.builtin.file:
    path: "{{ fim_aide_conf_path | dirname }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: FIM | Ensure AIDE DB directory exists
  ansible.builtin.file:
    path: "{{ fim_aide_db_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  become: true

- name: FIM | Ensure report directory exists
  ansible.builtin.file:
    path: /var/log/aide
    state: directory
    mode: "0750"
    owner: root
    group: root
  become: true

- name: FIM | Ensure FIM artifact directory exists
  ansible.builtin.file:
    path: /var/log/aide/ccdc
    state: directory
    mode: "0750"
    owner: root
    group: root
  become: true

- name: FIM | Ensure /var/lib exists (baseline stamp location)
  ansible.builtin.file:
    path: /var/lib
    state: directory
    mode: "0755"
  become: true

# ----------------------------
# Write an authoritative minimal config
# ----------------------------
- name: FIM | Deploy minimal authoritative AIDE config (no distro defaults)
  ansible.builtin.copy:
    dest: "{{ fim_aide_conf_path }}"
    mode: "0640"
    owner: root
    group: root
    content: |
      # ============================================
      # CCDC FIM (AIDE) - managed by Ansible
      # Minimal config to avoid distro-default noisy scopes.
      # ============================================

      database_in=file:{{ fim_aide_db_plain }}
      database_out=file:{{ fim_aide_db_new_plain }}

      report_url=file:/var/log/aide/aide-report.log

      # Rule definition (Ubuntu-safe '+' syntax)
      {{ fim_aide_rule }} = {{ fim_aide_rule_attrs }}

      # Excludes (regex)
      {% for e in fim_aide_excludes %}
      !{{ e }}
      {% endfor %}

      # Monitored paths (regex) - keep tight
      {% for p in fim_aide_paths %}
      {{ p }}  {{ fim_aide_rule }}
      {% endfor %}
  become: true

# ----------------------------
# Initialize AIDE DB only if not present
# ----------------------------
- name: FIM | Check if AIDE DB exists (gz)
  ansible.builtin.stat:
    path: "{{ fim_aide_db_gz }}"
  register: fim_aide_db_gz_stat
  become: true

- name: FIM | Check if AIDE DB exists (plain)
  ansible.builtin.stat:
    path: "{{ fim_aide_db_plain }}"
  register: fim_aide_db_plain_stat
  become: true

- name: FIM | Initialize AIDE database (first run)
  ansible.builtin.command: "aide --config {{ fim_aide_conf_path }} --init"
  when:
    - fim_aide_initialize_db | bool
    - not fim_aide_db_gz_stat.stat.exists
    - not fim_aide_db_plain_stat.stat.exists
  register: fim_aide_init
  changed_when: true
  failed_when: false
  become: true

- name: FIM | Promote DB.new into place (idempotent)
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -f "{{ fim_aide_db_new_gz }}" ]; then
      mv -f "{{ fim_aide_db_new_gz }}" "{{ fim_aide_db_gz }}"
      chown root:root "{{ fim_aide_db_gz }}"
      chmod 0640 "{{ fim_aide_db_gz }}"
    elif [ -f "{{ fim_aide_db_new_plain }}" ]; then
      mv -f "{{ fim_aide_db_new_plain }}" "{{ fim_aide_db_plain }}"
      chown root:root "{{ fim_aide_db_plain }}"
      chmod 0640 "{{ fim_aide_db_plain }}"
    fi
  args:
    executable: /bin/bash
  when:
    - fim_aide_initialize_db | bool
    - not fim_aide_db_gz_stat.stat.exists
    - not fim_aide_db_plain_stat.stat.exists
  changed_when: true
  failed_when: false
  become: true

# ----------------------------
# Deploy check script + cron
# ----------------------------
- name: FIM | Create FIM script directory
  ansible.builtin.file:
    path: "{{ fim_aide_script_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: FIM | Deploy periodic AIDE check script (Discord + artifact on diff/error)
  ansible.builtin.copy:
    dest: "{{ fim_aide_script_path }}"
    mode: "0750"
    owner: root
    group: root
    content: |
      #!/usr/bin/env bash
      {% raw %}
      set -euo pipefail

      export PATH="/usr/sbin:/usr/bin:/sbin:/bin"

      HOST="$(hostname -f 2>/dev/null || hostname)"
      CONF="__CONF__"

      DB_GZ="__DB_GZ__"
      DB_PLAIN="__DB_PLAIN__"
      STAMP="/var/lib/ccdc-fim-baseline-missing.stamp"

      REPORT_DIR="/var/log/aide/ccdc"
      TS="$(date -u +%Y%m%dT%H%M%SZ)"
      REPORT_FILE="${REPORT_DIR}/aide-${HOST}-${TS}.txt"
      LATEST_FILE="${REPORT_DIR}/latest-${HOST}.txt"

      mkdir -p "$REPORT_DIR" 2>/dev/null || true
      chmod 0750 "$REPORT_DIR" 2>/dev/null || true

      SENDER="__SENDER__"
      TAIL_LINES="__TAIL_LINES__"

      send_msg() {
        local title="$1"
        local msg="$2"
        if [ -x "$SENDER" ] || [ -f "$SENDER" ]; then
          python3 "$SENDER" "$title" "$msg" >/dev/null 2>&1 || true
        else
          logger -t ccdc-fim "$title - $msg"
        fi
      }

      summarize_rc() {
        local rc="$1"
        local parts=()
        if (( rc & 1 )); then parts+=("NEW"); fi
        if (( rc & 2 )); then parts+=("REMOVED"); fi
        if (( rc & 4 )); then parts+=("CHANGED"); fi
        if [ "${#parts[@]}" -eq 0 ]; then
          echo "NONE"
        else
          (IFS=','; echo "${parts[*]}")
        fi
      }

      severity_for() {
        local rc="$1"
        if (( rc & 2 )) || (( rc & 4 )); then
          echo "HIGH"
        else
          echo "MEDIUM"
        fi
      }

      # Baseline missing reminder (max 1/day)
      if [ ! -f "$DB_GZ" ] && [ ! -f "$DB_PLAIN" ]; then
        NOW_EPOCH="$(date +%s)"
        LAST_EPOCH=0
        if [ -f "$STAMP" ]; then
          LAST_EPOCH="$(cat "$STAMP" 2>/dev/null || echo 0)"
        fi
        if [ $((NOW_EPOCH - LAST_EPOCH)) -ge 86400 ]; then
          send_msg "AIDE Baseline Missing" "Host: ${HOST}\n\nAIDE DB not found. Run the FIM baseline play to create it.\nConfig: ${CONF}\nArtifact dir: ${REPORT_DIR}"
          echo "$NOW_EPOCH" > "$STAMP" 2>/dev/null || true
        fi
        exit 0
      fi

      # Prevent overlap (skip locking if flock not present)
      if command -v flock >/dev/null 2>&1; then
        LOCK="/var/lock/ccdc-fim-aide.lock"
        exec 9>"$LOCK"
        flock -n 9 || exit 0
      fi

      OUT="$(mktemp)"
      RC=0

      # AIDE --check exit status is a bitmask:
      # 1=new files, 2=removed files, 4=changed files (can be combined up to 7).
      aide --config "$CONF" --check >"$OUT" 2>&1 || RC=$?

      # Write forensic artifact for any non-zero outcome (diff or error)
      if [ "$RC" -ne 0 ]; then
        CATS="$(summarize_rc "$RC")"
        SEV="$(severity_for "$RC")"

        {
          echo "CCDC FIM (AIDE) Report"
          echo "Timestamp (UTC): ${TS}"
          echo "Host: ${HOST}"
          echo "Config: ${CONF}"
          echo "Exit code: ${RC}"
          echo "Categories: ${CATS}"
          echo "Severity: ${SEV}"
          echo "----------------------------------------"
          cat "$OUT"
          echo
        } > "$REPORT_FILE" 2>/dev/null || true

        cp -f "$REPORT_FILE" "$LATEST_FILE" 2>/dev/null || true

        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum "$REPORT_FILE" > "${REPORT_FILE}.sha256" 2>/dev/null || true
        fi

        # Keep last 50 reports per host
        ls -1t "${REPORT_DIR}/aide-${HOST}-"*.txt 2>/dev/null | tail -n +51 | xargs -r rm -f 2>/dev/null || true
        ls -1t "${REPORT_DIR}/aide-${HOST}-"*.txt.sha256 2>/dev/null | tail -n +51 | xargs -r rm -f 2>/dev/null || true
      fi

      if [ "$RC" -ge 1 ] && [ "$RC" -le 7 ]; then
        DETAILS="$(tail -n "${TAIL_LINES}" "$OUT")"
        CATS="$(summarize_rc "$RC")"
        SEV="$(severity_for "$RC")"
        send_msg "AIDE Integrity Changes [${SEV}] (rc=${RC}: ${CATS})" "Host: ${HOST}\nReport: ${REPORT_FILE}\nConfig: ${CONF}\n\n${DETAILS}"
      elif [ "$RC" -ne 0 ]; then
        DETAILS="$(tail -n "${TAIL_LINES}" "$OUT")"
        send_msg "AIDE Check Error (rc=${RC})" "Host: ${HOST}\nReport: ${REPORT_FILE}\nConfig: ${CONF}\n\n${DETAILS}"
      fi

      rm -f "$OUT"
      exit 0
      {% endraw %}
  become: true
  vars:
    # Inject Ansible vars safely without letting Jinja parse the bash internals.
    __SENDER__: "{{ fim_discord_sender_path }}"
    __TAIL_LINES__: "{{ fim_discord_tail_lines }}"
    __CONF__: "{{ fim_aide_conf_path }}"
    __DB_GZ__: "{{ fim_aide_db_gz }}"
    __DB_PLAIN__: "{{ fim_aide_db_plain }}"


- name: FIM | Create cron job for periodic AIDE checks
  ansible.builtin.cron:
    name: "CCDC AIDE Integrity Check"
    minute: "{{ fim_aide_cron_minute }}"
    hour: "{{ fim_aide_cron_hour }}"
    user: root
    job: "{{ fim_aide_script_path }}"
    state: present
  become: true

- name: FIM | Display summary
  ansible.builtin.debug:
    msg:
      - "FIM (AIDE) configured:"
      - "  • Config: {{ fim_aide_conf_path }}"
      - "  • Rule: {{ fim_aide_rule }} = {{ fim_aide_rule_attrs }}"
      - "  • Paths: {{ fim_aide_paths | join(', ') }}"
      - "  • Excludes: {{ fim_aide_excludes | length }} patterns"
      - "  • Script: {{ fim_aide_script_path }}"
      - "  • Cron: {{ fim_aide_cron_minute }} {{ fim_aide_cron_hour }}"
      - "  • Discord sender: {{ fim_discord_sender_path }} (used if present)"
