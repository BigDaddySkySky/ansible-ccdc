# ============================================
# STAGING ENVIRONMENT (VMware VMs)
# ============================================
# Updated for Sprint 1 with actual VM IPs
# ============================================

[linux_servers]
ubuntu_ecom_vm ansible_host=192.168.1.250
fedora_webmail_vm ansible_host=192.168.1.251
# splunk_vm ansible_host=192.168.1.XXX  # Sprint 3+

[linux_servers:vars]
ansible_user=ccdc
ansible_password=changeme
ansible_become_password=changeme
ansible_python_interpreter=/usr/bin/python3

# ============================================
# PRIORITY GROUPS (for targeted execution)
# ============================================

[critical_services]
# Hosts that MUST stay up for scoring
ubuntu_ecom_vm
fedora_webmail_vm

[scoring_services]
# Hosts with services being actively scored
ubuntu_ecom_vm
fedora_webmail_vm

[web_servers]
# Hosts running HTTP/HTTPS
ubuntu_ecom_vm
fedora_webmail_vm

[mail_servers]
# Hosts running mail services (SMTP/POP3/IMAP)
fedora_webmail_vm

[database_servers]
# Hosts running databases
ubuntu_ecom_vm
fedora_webmail_vm

[monitoring]
# Hosts for logging/monitoring (add in Sprint 3)
# splunk_vm

# ============================================
# GLOBAL VARIABLES
# ============================================

[all:vars]
# Flag to indicate this is staging (not competition)
staging_environment=true

# SSH settings (don't verify host keys for VMs)
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Connection timeout (detect unreachable hosts faster)
ansible_timeout=10

# Competition metadata (for testing)
team_number=99
competition_name=MWCCDC2025-STAGING
