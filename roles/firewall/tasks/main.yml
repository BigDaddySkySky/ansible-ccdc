---
# ============================================
# FIREWALL HARDENING ROLE - MAIN TASKS
# ============================================
# Purpose: Configure host-based firewall for CCDC competition
# Priority: CRITICAL (second only to SSH hardening)
# Testing: Always test on VM snapshot first!
# ============================================

- name: Display firewall hardening header
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "🔥 Firewall Hardening: {{ inventory_hostname }}"
      - "Backend: {{ firewall_backend }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# ============================================
# Pre-flight Checks
# ============================================

- name: Include pre-flight checks
  ansible.builtin.include_tasks: preflight.yml

# ============================================
# Kernel Security Settings
# ============================================

- name: Include kernel hardening tasks
  ansible.builtin.include_tasks: kernel_hardening.yml
  when: firewall_enable_syn_protection | bool

# ============================================
# UFW Configuration (Debian/Ubuntu)
# ============================================

- name: Include UFW configuration tasks
  ansible.builtin.include_tasks: ufw.yml
  when:
    - firewall_backend == "ufw"
    - firewall_enabled | bool

# ============================================
# Firewalld Configuration (RedHat/Fedora)
# ============================================

- name: Include firewalld configuration tasks
  ansible.builtin.include_tasks: firewalld.yml
  when:
    - firewall_backend == "firewalld"
    - firewall_enabled | bool

# ============================================
# Validation
# ============================================

- name: Include validation tasks
  ansible.builtin.include_tasks: validate.yml

# ============================================
# Summary
# ============================================

- name: Display completion message
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "✅ Firewall Hardening Complete: {{ inventory_hostname }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - ""
      - "Configuration applied:"
      - "  • Backend: {{ firewall_backend }}"
      - "  • Default incoming: {{ firewall_default_incoming | upper }}"
      - "  • Default outgoing: {{ firewall_default_outgoing | upper }}"
      - "  • Scored services: {{ firewall_scored_services | length }}"
      - "{{ '  • Rate limiting: ENABLED' if firewall_enable_rate_limiting else '  • Rate limiting: DISABLED' }}"
      - "{{ '  • Logging: ' ~ firewall_log_level | upper if firewall_enable_logging else '  • Logging: DISABLED' }}"
      - ""
      - "⚠️  IMPORTANT: Verify services are still accessible!"
      - "Test: curl http://{{ ansible_host }}"
