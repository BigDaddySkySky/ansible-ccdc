---
extends: default
rules:
  line-length:
    max: 140
    allow-non-breakable-words: true
  indentation:
    indent-sequences: consistent
    spaces: 2
  trailing-spaces: enable
  new-lines:
    type: unix
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  document-start:
    present: false
