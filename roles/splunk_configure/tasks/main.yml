---
# Splunk server configuration (competition-safe, first-run safe, idempotent)
# Goals:
# - Seed admin exactly once (user-seed.conf) if Splunk has no user DB yet
# - Ensure Splunk is running and management port responds
# - Ensure vaulted admin auth works (rotate from default only if needed)
# - Enable receiving on 9997 for Universal Forwarders
# - Enable boot-start (best effort)
#
# Assumptions:
# - Splunk is installed to /opt/splunk
# - Splunk runs as user: splunk
# - vault_splunk_admin_password is the desired final admin password
# - vault_default_password is ONLY used to rotate away from an initial default, if applicable

- name: Define Splunk paths
  ansible.builtin.set_fact:
    splunk_home: /opt/splunk
    splunk_bin: /opt/splunk/bin/splunk
    splunk_user_db: /opt/splunk/etc/passwd
    splunk_user_seed: /opt/splunk/etc/system/local/user-seed.conf
    splunk_mgmt_url: https://127.0.0.1:8089/services/server/info
    splunk_receiver_port: 9997
  changed_when: false

- name: Ensure /opt/splunk exists (no recursive ownership)
  ansible.builtin.file:
    path: "{{ splunk_home }}"
    state: directory
    owner: splunk
    group: splunk
    mode: "0755"
  become: true

- name: Check Splunk binary exists
  ansible.builtin.stat:
    path: "{{ splunk_bin }}"
  register: splunk_bin_stat
  become: true

- name: Fail if Splunk is not installed
  ansible.builtin.fail:
    msg: "Splunk binary not found at {{ splunk_bin }}. Install Splunk first, then re-run."
  when: not splunk_bin_stat.stat.exists

# ---------------------------------------------------------------------------
# FIRST-RUN ADMIN SEEDING (only when user DB doesn't exist)
# ---------------------------------------------------------------------------

- name: Check if Splunk user database exists
  ansible.builtin.stat:
    path: "{{ splunk_user_db }}"
  register: splunk_passwd
  become: true

- name: Stop Splunk before first-run seeding (best effort)
  ansible.builtin.command:
    cmd: "{{ splunk_bin }} stop"
  become: true
  become_user: splunk
  changed_when: false
  failed_when: false
  when: not splunk_passwd.stat.exists

- name: Seed initial Splunk admin via user-seed.conf (first run only)
  ansible.builtin.copy:
    dest: "{{ splunk_user_seed }}"
    owner: splunk
    group: splunk
    mode: "0600"
    content: |
      [user_info]
      USERNAME = admin
      PASSWORD = {{ vault_splunk_admin_password }}
  become: true
  no_log: true
  when: not splunk_passwd.stat.exists

# ---------------------------------------------------------------------------
# START SPLUNK + WAIT FOR MGMT PORT
# ---------------------------------------------------------------------------

- name: Start Splunk (accept license / no prompt)
  ansible.builtin.command:
    cmd: "{{ splunk_bin }} start --accept-license --answer-yes --no-prompt"
  become: true
  become_user: splunk
  register: splunk_start
  changed_when: not splunk_passwd.stat.exists
  failed_when: false

- name: Wait for Splunkd management port (8089)
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 8089
    state: started
    delay: 3
    timeout: 180

- name: Probe Splunk management endpoint (no auth; accepts 200/401)
  ansible.builtin.uri:
    url: "{{ splunk_mgmt_url }}"
    method: GET
    validate_certs: false
    status_code: [200, 401]
  register: splunk_mgmt_probe
  retries: 12
  delay: 5
  until: splunk_mgmt_probe.status is defined and splunk_mgmt_probe.status in [200, 401]
  changed_when: false
  failed_when: false

# ---- Admin password handling ----
# If the admin password is already set to vault_splunk_admin_password, do nothing.
# If Splunk is still on the default password, change it.
# If neither works, fail with a clear message (no secret output).

- name: Verify Splunk admin password (vault) works
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/server/info"
    method: GET
    user: admin
    password: "{{ vault_splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: splunk_admin_verify
  changed_when: false
  failed_when: false
  no_log: true

- name: Change Splunk admin password from default (only if needed)
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/authentication/users/admin"
    method: POST
    user: admin
    password: "{{ vault_default_password }}"
    body_format: form-urlencoded
    body:
      password: "{{ vault_splunk_admin_password }}"
      oldpassword: "{{ vault_default_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  when: splunk_admin_verify.status != 200
  register: splunk_pw_change
  changed_when: true
  failed_when: false
  no_log: true

- name: Re-verify Splunk admin password works after change
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/server/info"
    method: GET
    user: admin
    password: "{{ vault_splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: splunk_admin_verify_after
  changed_when: false
  no_log: true

- name: Fail if Splunk admin credentials are not valid
  ansible.builtin.fail:
    msg: >-
      Unable to authenticate to Splunk as admin using the vaulted password,
      and unable to rotate from the configured default password.
      Fix credentials manually, then rerun.
  when: splunk_admin_verify_after.status != 200

# ---- Enable receiving on 9997 (required for forwarders) ----
- name: Enable Splunk receiving on 9997
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk enable listen 9997 -auth "admin:{{ vault_splunk_admin_password }}"
  become: true
  become_user: splunk
  register: splunk_enable_listen
  changed_when: "'enabled' in (splunk_enable_listen.stdout | lower)"
  failed_when: false
  no_log: true

- name: Restart Splunk to apply receiver settings (if needed)
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk restart
  become: true
  become_user: splunk
  when: splunk_enable_listen.rc == 0
  changed_when: true

- name: Verify receiver port is listening (9997)
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9997
    state: started
    delay: 2
    timeout: 60

- name: Verify Splunk status
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk status
  become: true
  become_user: splunk
  changed_when: false
