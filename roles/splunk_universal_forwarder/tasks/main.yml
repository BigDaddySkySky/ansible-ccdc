---
# ---------------------------------------------------------------------------
# Receiver resolution
# ---------------------------------------------------------------------------

- name: Determine Splunk receiver host
  ansible.builtin.set_fact:
    splunk_receiver_effective_host: >-
      {{
        (splunk_receiver_host | default('') | trim)
        if (splunk_receiver_host | default('') | trim) != ''
        else (
          (hostvars['splunk']['ansible_host']
            | default(hostvars['splunk']['inventory_hostname'])
            | default(''))
          if (splunk_receiver_from_inventory | default(true) | bool and 'splunk' in hostvars)
          else ''
        )
      }}
    splunk_receiver_effective_port: "{{ splunk_receiver_port | default(9997) }}"
  changed_when: false

- name: Fail if Splunk receiver host is not defined
  ansible.builtin.fail:
    msg: >-
      Splunk receiver host not set. Set splunk_receiver_host (preferred) in group vars,
      OR ensure inventory contains a host named 'splunk' with ansible_host.
  when: splunk_receiver_effective_host | trim == ""

# ---------------------------------------------------------------------------
# UF presence check (idempotent fast path)
# ---------------------------------------------------------------------------

- name: Check if UF is already installed
  ansible.builtin.stat:
    path: "{{ splunk_uf_bin }}"
  register: uf_installed
  become: true

# ---------------------------------------------------------------------------
# Package selection / source path
# ---------------------------------------------------------------------------

- name: Select UF download URL for platform
  ansible.builtin.set_fact:
    splunk_forwarder_url: "{{ splunk_forwarder_rpm_url if ansible_os_family == 'RedHat' else splunk_forwarder_deb_url }}"
    splunk_forwarder_pkg: "{{ (splunk_forwarder_rpm_url if ansible_os_family == 'RedHat' else splunk_forwarder_deb_url) | basename }}"
  when: not uf_installed.stat.exists
  changed_when: false

- name: Set UF package path (local override supported)
  ansible.builtin.set_fact:
    splunk_forwarder_pkg_path: >-
      {{
        (splunk_forwarder_local_pkg | default('') | trim)
        if (splunk_forwarder_local_pkg | default('') | trim) != ''
        else "/tmp/{{ splunk_forwarder_pkg }}"
      }}
  when: not uf_installed.stat.exists
  changed_when: false

# ---------------------------------------------------------------------------
# Obtain package (download only if needed)
# ---------------------------------------------------------------------------

- name: Download UF package when no local package is provided
  ansible.builtin.get_url:
    url: "{{ splunk_forwarder_url }}"
    dest: "/tmp/{{ splunk_forwarder_pkg }}"
    mode: "0644"
    validate_certs: "{{ splunk_forwarder_validate_certs | default(true) | bool }}"
    timeout: 300
  when:
    - not uf_installed.stat.exists
    - (splunk_forwarder_local_pkg | default('') | trim) == ''
  become: true

- name: Verify UF package exists
  ansible.builtin.stat:
    path: "{{ splunk_forwarder_pkg_path }}"
  register: uf_pkg_stat
  when: not uf_installed.stat.exists
  become: true

- name: Fail if UF package is missing
  ansible.builtin.fail:
    msg: "UF package not found at {{ splunk_forwarder_pkg_path }}."
  when:
    - not uf_installed.stat.exists
    - not uf_pkg_stat.stat.exists

# ---------------------------------------------------------------------------
# Install UF
# ---------------------------------------------------------------------------

- name: Install UF (Debian/Ubuntu)
  ansible.builtin.apt:
    deb: "{{ splunk_forwarder_pkg_path }}"
    state: present
  when:
    - not uf_installed.stat.exists
    - ansible_os_family == "Debian"
  become: true

- name: Install UF (RedHat/Fedora)
  ansible.builtin.dnf:
    name: "{{ splunk_forwarder_pkg_path }}"
    state: present
    disable_gpg_check: true
  when:
    - not uf_installed.stat.exists
    - ansible_os_family == "RedHat"
  become: true

# Re-check UF presence after install
- name: Re-check UF binary exists
  ansible.builtin.stat:
    path: "{{ splunk_uf_bin }}"
  register: uf_bin_after
  become: true

- name: Fail if UF binary missing after install
  ansible.builtin.fail:
    msg: "UF binary not found at {{ splunk_uf_bin }} after install."
  when: not uf_bin_after.stat.exists

# ---------------------------------------------------------------------------
# First start / license (idempotent)
# ---------------------------------------------------------------------------

- name: Start UF and accept license (first run only)
  ansible.builtin.command:
    cmd: "{{ splunk_uf_bin }} start --accept-license --answer-yes --no-prompt"
  args:
    creates: "{{ splunk_uf_home }}/var/log/splunk/splunkd.log"
  become: true
  become_user: "{{ splunk_uf_user }}"
  changed_when: true
  failed_when: false

# ---------------------------------------------------------------------------
# Persist across reboot (best effort)
# ---------------------------------------------------------------------------

- name: Enable UF boot-start (best effort)
  ansible.builtin.command:
    cmd: "{{ splunk_uf_bin }} enable boot-start -user {{ splunk_uf_user }} --accept-license --answer-yes --no-prompt"
  register: uf_bootstart
  changed_when: "'configured to start automatically' in (uf_bootstart.stdout | lower | default(''))"
  failed_when: false
  become: true

# ---------------------------------------------------------------------------
# Configure outputs.conf / inputs.conf
# ---------------------------------------------------------------------------

- name: Ensure UF local config directory exists
  ansible.builtin.file:
    path: "{{ splunk_uf_home }}/etc/system/local"
    state: directory
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0750"
  become: true

- name: Configure outputs.conf default group
  ansible.builtin.ini_file:
    path: "{{ splunk_uf_home }}/etc/system/local/outputs.conf"
    create: true
    section: tcpout
    option: defaultGroup
    value: "splunk_indexers"
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0600"
  become: true
  notify:
    - restart splunk forwarder
    - wait for uf mgmt port

- name: Configure outputs.conf receiver target
  ansible.builtin.ini_file:
    path: "{{ splunk_uf_home }}/etc/system/local/outputs.conf"
    create: true
    section: tcpout:splunk_indexers
    option: server
    value: "{{ splunk_receiver_effective_host }}:{{ splunk_receiver_effective_port }}"
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0600"
  become: true
  notify:
    - restart splunk forwarder
    - wait for uf mgmt port

# -------------------------
# Inputs: audit (only if file exists)
# -------------------------

- name: Check audit log exists
  ansible.builtin.stat:
    path: /var/log/audit/audit.log
  register: audit_log
  become: true

- name: Configure audit log input (only if present)
  ansible.builtin.blockinfile:
    path: "{{ splunk_uf_home }}/etc/system/local/inputs.conf"
    create: true
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE CCDC AUDIT INPUT"
    block: |
      [monitor:///var/log/audit/audit.log]
      disabled = 0
      index = {{ splunk_uf_index }}
      sourcetype = linux_audit
  when:
    - splunk_uf_enable_audit | bool
    - audit_log.stat.exists
  become: true
  notify:
    - restart splunk forwarder
    - wait for uf mgmt port

# -------------------------
# Inputs: auth/secure (only if file exists)
# -------------------------

- name: Check Debian auth log exists
  ansible.builtin.stat:
    path: /var/log/auth.log
  register: deb_auth_log
  when: ansible_os_family == "Debian"
  become: true

- name: Check RedHat secure log exists
  ansible.builtin.stat:
    path: /var/log/secure
  register: rh_secure_log
  when: ansible_os_family == "RedHat"
  become: true

- name: Configure auth input (Debian, only if present)
  ansible.builtin.blockinfile:
    path: "{{ splunk_uf_home }}/etc/system/local/inputs.conf"
    create: true
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE CCDC AUTH INPUT"
    block: |
      [monitor:///var/log/auth.log]
      disabled = 0
      index = {{ splunk_uf_index }}
      sourcetype = linux_secure
  when:
    - splunk_uf_enable_auth | bool
    - ansible_os_family == "Debian"
    - deb_auth_log.stat.exists
  become: true
  notify:
    - restart splunk forwarder
    - wait for uf mgmt port

- name: Configure auth input (RedHat, only if present)
  ansible.builtin.blockinfile:
    path: "{{ splunk_uf_home }}/etc/system/local/inputs.conf"
    create: true
    owner: "{{ splunk_uf_user }}"
    group: "{{ splunk_uf_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE CCDC AUTH INPUT"
    block: |
      [monitor:///var/log/secure]
      disabled = 0
      index = {{ splunk_uf_index }}
      sourcetype = linux_secure
  when:
    - splunk_uf_enable_auth | bool
    - ansible_os_family == "RedHat"
    - rh_secure_log.stat.exists
  become: true
  notify:
    - restart splunk forwarder
    - wait for uf mgmt port

# ---------------------------------------------------------------------------
# Validation (proves forwarding is configured, not just installed)
# ---------------------------------------------------------------------------

- name: UF status (non-fatal, informational)
  ansible.builtin.command:
    cmd: "{{ splunk_uf_bin }} status"
  become: true
  become_user: "{{ splunk_uf_user }}"
  register: uf_status
  changed_when: false
  failed_when: false

- name: List forward servers
  ansible.builtin.command:
    cmd: "{{ splunk_uf_bin }} list forward-server"
  become: true
  become_user: "{{ splunk_uf_user }}"
  register: uf_fwd
  changed_when: false
  failed_when: false

- name: Fail if receiver not present in forwarding list
  ansible.builtin.fail:
    msg: |
      UF installed but forwarding not confirmed.
      Expected receiver: {{ splunk_receiver_effective_host }}:{{ splunk_receiver_effective_port }}

      UF status:
      {{ uf_status.stdout | default('') }}

      Forward-server output:
      {{ uf_fwd.stdout | default('') }}

      Common causes:
      - Receiver IP/host wrong
      - Network path blocked
      - UF not restarted after config change
  when: (splunk_receiver_effective_host ~ ":" ~ splunk_receiver_effective_port|string) not in (uf_fwd.stdout | default(''))
