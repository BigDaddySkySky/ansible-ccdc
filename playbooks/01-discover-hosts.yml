---
# ============================================
# HOST DISCOVERY & BASELINE REPORT
# ============================================
# Purpose: Discover services, ports, packages on target hosts
# Use Case: Competition day - "What do we have?"
# Runtime: 2-3 minutes per host
# Safe: YES (read-only reconnaissance)
# ============================================
# Usage:
#   ansible-playbook playbooks/02-discover-hosts.yml
#   ansible-playbook playbooks/02-discover-hosts.yml --limit ubuntu_ecom_vm
# ============================================

- name: Host Discovery - Gather Intelligence
  hosts: all
  gather_facts: true

  tasks:
    - name: Display discovery header
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "🔍 Discovering: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # ============================================
    # System Information
    # ============================================
    - name: Gather system information
      ansible.builtin.set_fact:
        system_info:
          hostname: "{{ ansible_hostname }}"
          fqdn: "{{ ansible_fqdn }}"
          distribution: "{{ ansible_distribution }}"
          distribution_version: "{{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          architecture: "{{ ansible_architecture }}"
          python_version: "{{ ansible_python_version }}"
          uptime_seconds: "{{ ansible_uptime_seconds }}"

    - name: Display system info
      ansible.builtin.debug:
        msg:
          - "System Information:"
          - "  OS: {{ system_info.distribution }} {{ system_info.distribution_version }}"
          - "  Kernel: {{ system_info.kernel }}"
          - "  Arch: {{ system_info.architecture }}"
          - "  Python: {{ system_info.python_version }}"
          - "  Uptime: {{ (system_info.uptime_seconds | int / 3600) | round(1) }} hours"

    # ============================================
    # Network Information
    # ============================================
    - name: Get all listening ports
      ansible.builtin.shell: |
        ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null | grep LISTEN
      register: listening_ports
      changed_when: false
      failed_when: false

    - name: Parse listening ports
      ansible.builtin.set_fact:
        open_ports: "{{ listening_ports.stdout_lines | map('regex_search', ':(\\d+)', '\\1') | select('string') | map('first') | unique | sort | list }}"
      when: listening_ports.rc == 0

    - name: Display network info
      ansible.builtin.debug:
        msg:
          - ""
          - "Network Information:"
          - "  Listening Ports: {{ open_ports | join(', ') if open_ports is defined else 'Unable to determine' }}"

    # ============================================
    # Service Discovery
    # ============================================
    - name: List all running systemd services
      ansible.builtin.shell: |
        systemctl list-units --type=service --state=running --no-pager --no-legend | awk '{print $1}'
      register: running_services
      changed_when: false
      failed_when: false

    - name: Filter critical services
      ansible.builtin.set_fact:
        critical_services:
          web: "{{ running_services.stdout_lines | select('search', 'apache2|httpd|nginx') | list }}"
          mail: "{{ running_services.stdout_lines | select('search', 'postfix|dovecot|exim|sendmail') | list }}"
          database: "{{ running_services.stdout_lines | select('search', 'mysql|mariadb|postgresql') | list }}"
          ssh: "{{ running_services.stdout_lines | select('search', 'sshd|ssh') | list }}"
          dns: "{{ running_services.stdout_lines | select('search', 'bind9|named') | list }}"
          ftp: "{{ running_services.stdout_lines | select('search', 'vsftpd|proftpd') | list }}"
      when: running_services.rc == 0

    - name: Display critical services
      ansible.builtin.debug:
        msg:
          - ""
          - "Critical Services:"
          - "  Web: {{ critical_services.web | join(', ') if critical_services.web | length > 0 else 'None' }}"
          - "  Mail: {{ critical_services.mail | join(', ') if critical_services.mail | length > 0 else 'None' }}"
          - "  Database: {{ critical_services.database | join(', ') if critical_services.database | length > 0 else 'None' }}"
          - "  SSH: {{ critical_services.ssh | join(', ') if critical_services.ssh | length > 0 else 'None' }}"
          - "  DNS: {{ critical_services.dns | join(', ') if critical_services.dns | length > 0 else 'None' }}"
          - "  FTP: {{ critical_services.ftp | join(', ') if critical_services.ftp | length > 0 else 'None' }}"
      when: critical_services is defined

    # ============================================
    # Package Discovery
    # ============================================
    - name: Count installed packages (Debian-based)
      ansible.builtin.shell: dpkg -l | grep '^ii' | wc -l
      register: dpkg_count
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Debian"

    - name: Count installed packages (RedHat-based)
      ansible.builtin.shell: rpm -qa | wc -l
      register: rpm_count
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Check for security tools
      ansible.builtin.shell: |
        for pkg in fail2ban ufw firewalld iptables aide rkhunter chkrootkit auditd apparmor selinux; do
          if command -v $pkg &>/dev/null || dpkg -l $pkg 2>/dev/null | grep -q '^ii' || rpm -q $pkg &>/dev/null; then
            echo "$pkg: installed"
          fi
        done
      register: security_tools
      changed_when: false
      failed_when: false

    - name: Display package info
      ansible.builtin.debug:
        msg:
          - ""
          - "Package Information:"
          - "  Total packages: {{ dpkg_count.stdout if dpkg_count.stdout is defined else rpm_count.stdout if rpm_count.stdout is defined else 'Unknown' }}"
          - "  Security tools:"
          - "{{ security_tools.stdout_lines | map('regex_replace', '^', '    ') | list if security_tools.stdout_lines | length > 0 else ['    None detected'] }}"

    # ============================================
    # User Discovery
    # ============================================
    - name: List users with login shells
      ansible.builtin.shell: |
        awk -F: '$7 !~ /(nologin|false)/ {print $1}' /etc/passwd
      register: login_users
      changed_when: false

    - name: Check for users with UID 0 (root equivalent)
      ansible.builtin.shell: |
        awk -F: '$3 == 0 {print $1}' /etc/passwd
      register: uid_zero_users
      changed_when: false

    - name: Display user info
      ansible.builtin.debug:
        msg:
          - ""
          - "User Information:"
          - "  Users with login shells: {{ login_users.stdout_lines | join(', ') }}"
          - "  Users with UID 0 (root privileges): {{ uid_zero_users.stdout_lines | join(', ') }}"

    # ============================================
    # Suspicious Activity Checks
    # ============================================
    - name: Check for suspicious cron jobs
      ansible.builtin.shell: |
        find /etc/cron* /var/spool/cron -type f 2>/dev/null | xargs grep -l "curl\|wget\|nc\|bash -i" 2>/dev/null || echo "None found"
      register: suspicious_crons
      changed_when: false
      failed_when: false

    - name: Check for world-writable files in critical directories
      ansible.builtin.shell: |
        find /etc /usr/bin /usr/sbin -type f -perm -002 2>/dev/null | head -10
      register: world_writable
      changed_when: false
      failed_when: false

    - name: Check for SUID/SGID binaries
      ansible.builtin.shell: |
        find / -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null | wc -l
      register: suid_count
      changed_when: false
      failed_when: false

    - name: Display security checks
      ansible.builtin.debug:
        msg:
          - ""
          - "Security Checks:"
          - "  Suspicious cron jobs: {{ 'None' if suspicious_crons.stdout == 'None found' else suspicious_crons.stdout_lines | length }}"
          - "  World-writable files: {{ world_writable.stdout_lines | length if world_writable.stdout_lines else 0 }}"
          - "  SUID/SGID binaries: {{ suid_count.stdout }}"

    # ============================================
    # Resource Information
    # ============================================
    - name: Get disk usage
      ansible.builtin.shell: df -h / | tail -1 | awk '{print $2, $3, $5}'
      register: disk_usage
      changed_when: false

    - name: Get memory info
      ansible.builtin.shell: free -h | grep Mem | awk '{print $2, $3, $7}'
      register: memory_info
      changed_when: false

    - name: Display resource info
      ansible.builtin.debug:
        msg:
          - ""
          - "Resource Usage:"
          - "  Disk: {{ disk_usage.stdout }}"
          - "  Memory (Total Used Available): {{ memory_info.stdout }}"

    # ============================================
    # Generate Baseline Report
    # ============================================
    - name: Create discovery report
      ansible.builtin.set_fact:
        discovery_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          hostname: "{{ inventory_hostname }}"
          system: "{{ system_info }}"
          network:
            ip: "{{ ansible_host }}"
            open_ports: "{{ open_ports | default([]) }}"
          services:
            critical: "{{ critical_services | default({}) }}"
            total_running: "{{ running_services.stdout_lines | length if running_services.stdout_lines is defined else 0 }}"
          packages:
            total: "{{ dpkg_count.stdout if dpkg_count.stdout is defined else rpm_count.stdout if rpm_count.stdout is defined else 'Unknown' }}"
            security_tools: "{{ security_tools.stdout_lines if security_tools.stdout_lines is defined else [] }}"
          users:
            login_users: "{{ login_users.stdout_lines }}"
            uid_zero: "{{ uid_zero_users.stdout_lines }}"
          security:
            suspicious_crons: "{{ suspicious_crons.stdout_lines if suspicious_crons.stdout != 'None found' else [] }}"
            world_writable_count: "{{ world_writable.stdout_lines | length if world_writable.stdout_lines else 0 }}"
            suid_sgid_count: "{{ suid_count.stdout }}"
          resources:
            disk: "{{ disk_usage.stdout }}"
            memory: "{{ memory_info.stdout }}"

    - name: Save baseline report locally
      ansible.builtin.copy:
        content: "{{ discovery_report | to_nice_json }}"
        dest: "/tmp/{{ inventory_hostname }}_baseline.json"
      delegate_to: localhost
      become: false

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✅ Discovery complete for {{ inventory_hostname }}"
          - "📄 Report saved: /tmp/{{ inventory_hostname }}_baseline.json"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Generate Summary Report
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   DISCOVERY COMPLETE                     ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "Hosts scanned: {{ groups['all'] | length }}"
          - ""
          - "Baseline reports saved to:"
          - "  /tmp/*_baseline.json"
          - ""
          - "Review reports with:"
          - "  cat /tmp/*_baseline.json | jq"
          - ""
          - "Next steps:"
          - "  1. Review discovered services"
          - "  2. Identify security concerns"
          - "  3. Plan Sprint 2 hardening priorities"
