# ============================================
# STAGING ENVIRONMENT (Local KVM VMs)
# ============================================
# These IPs will be auto-populated by setup-vms.sh
# Or manually update after VM creation
# ============================================

[linux_servers]
# Update these after running ./scripts/setup-vms.sh
ubuntu_ecom_vm ansible_host=192.168.122.10
fedora_webmail_vm ansible_host=192.168.122.11
splunk_vm ansible_host=192.168.122.12

[linux_servers:vars]
ansible_user=ccdc
ansible_password=changeme
ansible_become_password=changeme

[windows_servers]
# Optional - add if you create Windows VMs
# dc01_vm ansible_host=192.168.122.20

[all:vars]
ansible_python_interpreter=/usr/bin/python3
staging_environment=true
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Connection timeout (detect unreachable hosts faster)
ansible_timeout=10
