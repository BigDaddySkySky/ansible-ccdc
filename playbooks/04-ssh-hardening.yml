---
# ============================================
# SSH HARDENING PLAYBOOK
# ============================================
# Purpose: Harden SSH configuration on all Linux hosts
# Priority: CRITICAL - Run this first in Sprint 3
# Runtime: 3-5 minutes per host
# Safe: YES (with pre-flight checks and validation)
# ============================================

- name: Pre-Flight Validation
  hosts: localhost
  gather_facts: false
  become: false
  
  tasks:
    - name: Display header
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   SSH HARDENING - SPRINT 3               ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "⚠️  CRITICAL: Read before proceeding!"
          - ""
          - "This playbook will:"
          - "  • Disable root SSH login"
          - "  • Disable password authentication"
          - "  • Enable key-only authentication"
          - "  • Install and configure fail2ban"
          - ""
          - "Prerequisites:"
          - "  ✅ SSH keys deployed on all targets"
          - "  ✅ VM snapshots created"
          - "  ✅ Connectivity verified"
          - ""
          - "Targets: {{ groups['all'] | join(', ') }}"
    
    - name: Verify SSH keys are available
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.ssh/ccdc_rsa"
      register: ssh_key_check
    
    - name: Fail if SSH key missing
      ansible.builtin.fail:
        msg: |
          SSH key not found at ~/.ssh/ccdc_rsa
          
          Run this first:
            ./scripts/setup-ssh-keys.sh
      when: not ssh_key_check.stat.exists
    
    - name: Display SSH key status
      ansible.builtin.debug:
        msg: "✅ SSH key found: ~/.ssh/ccdc_rsa"
    
    - name: Pause for confirmation
      ansible.builtin.pause:
        prompt: |
          
          ⚠️  LAST CHANCE TO ABORT!
          
          Have you created VM snapshots?
          Without snapshots, you cannot rollback if locked out!
          
          Press ENTER to continue, or Ctrl+C to abort
      when: confirm is not defined or confirm != "yes"

- name: Verify Target Connectivity
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  
  tasks:
    - name: Ping test
      ansible.builtin.ping:
      register: ping_result
    
    - name: Check for SSH keys on target
      ansible.builtin.stat:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
      register: target_keys
      when: ping_result is success
    
    - name: Display target status
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Host: {{ inventory_hostname }}"
          - "Reachable: {{ '✅' if ping_result is success else '❌' }}"
          - "{{ 'SSH keys present: ' + ('✅' if target_keys.stat.exists else '❌ MISSING') if ping_result is success else '' }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    - name: Fail if no SSH keys on target
      ansible.builtin.fail:
        msg: |
          No SSH keys found on {{ inventory_hostname }}!
          
          Path checked: /home/{{ ansible_user }}/.ssh/authorized_keys
          
          This host will be LOCKED OUT if we disable password auth!
          
          Fix:
            1. Revert VM to snapshot
            2. Run: ./scripts/setup-ssh-keys.sh
            3. Verify keys: ansible {{ inventory_hostname }} -m command -a "ls -la ~/.ssh/authorized_keys"
            4. Re-run this playbook
      when:
        - ping_result is success
        - not target_keys.stat.exists

- name: Apply SSH Hardening
  hosts: all
  gather_facts: true
  
  # Load vault variables before running role
  pre_tasks:
    - name: Load global vault variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
    
    - name: Load host-specific vault variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
    
    - name: Verify vault_host_password is loaded
      ansible.builtin.debug:
        msg: "✅ Vault password loaded for {{ inventory_hostname }}: {{ vault_host_password[:4] }}***"
    
    - name: Set ansible_become_password from vault
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_host_password }}"
  
  roles:
    - ssh_hardening

- name: Post-Hardening Validation
  hosts: localhost
  gather_facts: false
  become: false
  
  tasks:
    - name: Test SSH connectivity to all hosts
      ansible.builtin.command: ssh -i ~/.ssh/ccdc_rsa -o BatchMode=yes -o ConnectTimeout=5 {{ ansible_user }}@{{ hostvars[item].ansible_host }} 'echo SUCCESS'
      register: ssh_test
      failed_when: false
      changed_when: false
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ item }}"
    
    - name: Calculate results
      ansible.builtin.set_fact:
        successful_hosts: "{{ ssh_test.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
        failed_hosts: "{{ ssh_test.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    
    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   SSH HARDENING COMPLETE                 ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "Total hosts: {{ groups['all'] | length }}"
          - "✅ Successful: {{ successful_hosts | length }}"
          - "❌ Failed: {{ failed_hosts | length }}"
          - ""
          - "{{ 'Successful: ' ~ successful_hosts | join(', ') if successful_hosts else '' }}"
          - "{{ 'Failed: ' ~ failed_hosts | join(', ') if failed_hosts else '' }}"
          - ""
          - "Next steps:"
          - "  1. Test SSH manually:"
          - "     ssh -i ~/.ssh/ccdc_rsa sysadmin@192.168.1.250"
          - ""
          - "  2. Check fail2ban status:"
          - "     ansible all -m command -a 'fail2ban-client status sshd' -b"
          - ""
          - "  3. Create new VM snapshots: 'Post-SSH-Hardening'"
          - ""
          - "  4. Commit changes:"
          - "     git add -A"
          - "     git commit -m 'Sprint 3: SSH hardening complete'"
          - ""
          - "  5. Continue Sprint 3: Firewall configuration"
    
    - name: Fail if any hosts unreachable
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════╗
          ║   SSH HARDENING FAILED                   ║
          ╚══════════════════════════════════════════╝
          
          Some hosts are unreachable after hardening!
          
          Failed hosts: {{ failed_hosts | join(', ') }}
          
          IMMEDIATE ACTION REQUIRED:
          
          1. Revert failed VMs to snapshot
          2. Check logs: ansible {{ failed_hosts[0] }} -m command -a "journalctl -u sshd -n 50" -b
          3. Verify SSH keys: ansible {{ failed_hosts[0] }} -m command -a "ls -la ~/.ssh/authorized_keys"
          4. Test manually: ssh -i ~/.ssh/ccdc_rsa -vvv sysadmin@{{ hostvars[failed_hosts[0]].ansible_host }}
      when: failed_hosts | length > 0
