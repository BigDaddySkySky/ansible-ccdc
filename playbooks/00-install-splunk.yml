---
# ============================================
# PLAYBOOK: INSTALL SPLUNK ENTERPRISE
# ============================================
# Purpose:
#   - Ensure Splunk Enterprise is installed on the Splunk host
#   - DO NOT configure Splunk here (handled in 04-configure-splunk.yml)
#
# Competition safety goals:
#   - Avoid sudo during initial fact gathering (prevents "Missing sudo password" at setup)
#   - Never auto-uninstall/replace an unexpected Splunk version
#   - Support offline installs via splunk_local_rpm
# ============================================

- name: Ensure Splunk Enterprise is installed
  hosts: monitoring
  gather_facts: false
  become: false

  vars:
    splunk_rpm_url: "https://download.splunk.com/products/splunk/releases/9.1.1/linux/splunk-9.1.1-64e843ea36b1.x86_64.rpm"
    splunk_rpm_dest: "/tmp/splunk-9.1.1.rpm"
    splunk_expected_version: "9.1.1"

    # Optional: point to an RPM already on the target (e.g., /srv/splunk.rpm)
    splunk_local_rpm: ""

  tasks:
    # --- Non-privileged tasks first (no sudo dependency) ---

    - name: Gather minimal facts (no sudo)
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "min"

    - name: Check if Splunk binary exists
      ansible.builtin.stat:
        path: /opt/splunk/bin/splunk
      register: splunk_bin

    - name: Check installed Splunk version (if present)
      ansible.builtin.command:
        cmd: /opt/splunk/bin/splunk version --build
      register: splunk_version
      changed_when: false
      failed_when: false
      when: splunk_bin.stat.exists

    - name: Determine installed Splunk version string
      ansible.builtin.set_fact:
        splunk_installed_version: >-
          {{
            (splunk_version.stdout | regex_search('Splunk\\s+(\\d+\\.\\d+\\.\\d+)', '\\1'))
            | default('none')
          }}
      when: splunk_bin.stat.exists

    - name: Fail if Splunk is installed but not the expected version
      ansible.builtin.fail:
        msg: >-
          Splunk is installed (version {{ splunk_installed_version }}), but expected {{ splunk_expected_version }}.
          For competition stability, this play will not auto-uninstall/replace.
          Fix manually (or set splunk_local_rpm to the correct RPM) and rerun.
      when:
        - splunk_bin.stat.exists
        - splunk_installed_version != splunk_expected_version

    - name: Set effective RPM path (local override supported)
      ansible.builtin.set_fact:
        splunk_rpm_effective_path: >-
          {{
            (splunk_local_rpm | trim)
            if (splunk_local_rpm | trim) != ''
            else splunk_rpm_dest
          }}

    - name: Download Splunk RPM (only if not installed and no local rpm provided)
      ansible.builtin.get_url:
        url: "{{ splunk_rpm_url }}"
        dest: "{{ splunk_rpm_dest }}"
        mode: "0644"
        validate_certs: false
        timeout: 300
      when:
        - not splunk_bin.stat.exists
        - (splunk_local_rpm | trim) == ''

    - name: Verify Splunk RPM exists
      ansible.builtin.stat:
        path: "{{ splunk_rpm_effective_path }}"
      register: splunk_rpm_stat
      failed_when: not splunk_rpm_stat.stat.exists
      when: not splunk_bin.stat.exists

    - name: Install Splunk RPM via dnf CLI (dnf5-safe pattern)
      ansible.builtin.raw: "dnf install -y {{ splunk_rpm_effective_path }}"
      register: splunk_install
      changed_when: "'Nothing to do' not in (splunk_install.stdout | default(''))"
      when: not splunk_bin.stat.exists

    - name: Verify Splunk binary exists after install
      ansible.builtin.stat:
        path: /opt/splunk/bin/splunk
      register: splunk_bin_after
      failed_when: not splunk_bin_after.stat.exists
      when: not splunk_bin.stat.exists

    - name: Cleanup downloaded RPM (only if we downloaded it)
      ansible.builtin.file:
        path: "{{ splunk_rpm_dest }}"
        state: absent
      when:
        - not splunk_bin.stat.exists
        - (splunk_local_rpm | trim) == ''
