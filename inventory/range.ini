[linux_servers]
ubuntu       ansible_host=10.250.20.20 ansible_user=cnm
oracle_linux ansible_host=10.250.20.30 ansible_user=cnm

[unix_servers]
free_bsd     ansible_host=10.250.20.10 ansible_user=root

[security_tools]
kali      ansible_host=10.250.40.100 ansible_user=kali
wazu      ansible_host=10.250.40.110 ansible_user=cnm
sec_onion ansible_host=10.250.40.120 ansible_user=cnm
# splunk   ansible_host=10.250.40.130 ansible_user=cnm

[windows_devices]
win_19_web ansible_host=10.250.30.15 ansible_user=administrator
win_22_dns ansible_host=10.250.30.25 ansible_user=administrator
win_10     ansible_host=10.250.30.35 ansible_user=administrator

[network_devices]
pafw ansible_host=10.250.20.254
ftd  ansible_host=10.250.30.254
# vyos ansible_host=10.250.10.x

# Logical groups
[firewalls]
pafw
ftd

[ids_tools]
wazu
sec_onion

[attack_tools]
kali

# Children
[servers:children]
linux_servers
unix_servers
# windows_devices

[security_stack:children]
ids_tools
# siem

# Group vars (single block per group)
[linux_servers:vars]
ansible_become=true
ansible_become_method=sudo
ansible_password={{ vault_default_password }}
ansible_become_password={{ vault_default_password }}

[security_tools:vars]
ansible_become=true
ansible_become_method=sudo
ansible_password={{ vault_default_password }}
ansible_become_password={{ vault_default_password }}

[attack_tools:vars]
ansible_become=true
ansible_become_method=sudo
ansible_password={{ vault_default_password }}
ansible_become_password={{ vault_default_password }}

[unix_servers:vars]
ansible_become=false
ansible_password={{ vault_default_password }}
