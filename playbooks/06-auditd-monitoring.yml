---
# ============================================
# AUDITD MONITORING PLAYBOOK
# ============================================
# Purpose: Configure auditd-based intrusion detection
# Priority: CRITICAL - Defense-in-depth layer
# Runtime: 5-7 minutes per host
# Safe: YES (with pre-flight checks and validation)
# ============================================

- name: Pre-Flight Validation
  hosts: localhost
  gather_facts: false
  become: false
  
  tasks:
    - name: Display header
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   AUDITD MONITORING - SPRINT 3.3         ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "⚠️  CRITICAL: Read before proceeding!"
          - ""
          - "This playbook will:"
          - "  • Install auditd packages"
          - "  • Deploy file integrity monitoring"
          - "  • Enable privilege escalation detection"
          - "  • Configure authentication tracking"
          - "  • Set up Discord webhook alerts"
          - "  • Enable automated evidence collection"
          - ""
          - "Prerequisites:"
          - "  ✅ SSH hardening complete"
          - "  ✅ Firewall hardening complete"
          - "  ✅ VM snapshots created"
          - "  ✅ Discord webhook configured (optional)"
          - ""
          - "Targets: {{ groups['all'] | join(', ') }}"
    
    - name: Pause for confirmation
      ansible.builtin.pause:
        prompt: |
          
          ⚠️  LAST CHANCE TO ABORT!
          
          Have you created VM snapshots?
          Without snapshots, you cannot rollback if issues occur!
          
          Press ENTER to continue, or Ctrl+C to abort
      when: confirm is not defined or confirm != "yes"

- name: Verify Target Connectivity
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  
  tasks:
    - name: Ping test
      ansible.builtin.ping:
      register: ping_result
    
    - name: Check if SSH hardening was applied
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.backup.*
      register: ssh_hardening_check
      when: ping_result is success
    
    - name: Check if firewall is active
      ansible.builtin.command: "{{ 'ufw status' if ansible_os_family == 'Debian' else 'firewall-cmd --state' }}"
      register: firewall_check
      changed_when: false
      failed_when: false
      when: ping_result is success
    
    - name: Display target status
      ansible.builtin.debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Host: {{ inventory_hostname }}"
          - "Reachable: {{ '✅' if ping_result is success else '❌' }}"
          - "{{ 'SSH hardened: ' + ('✅' if ssh_hardening_check.stat.exists else '⚠️  Not yet hardened') if ping_result is success else '' }}"
          - "{{ 'Firewall: ' + ('✅ Active' if firewall_check.rc == 0 else '⚠️  Inactive') if ping_result is success else '' }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Apply Auditd Monitoring
  hosts: all
  gather_facts: true
  
  # Load vault variables before running role
  pre_tasks:
    - name: Load global vault variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
    
    - name: Load host-specific vault variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}/vault.yml"
    
    - name: Set ansible_become_password from vault
      ansible.builtin.set_fact:
        ansible_become_password: "{{ vault_host_password }}"
  
  roles:
    - auditd

- name: Post-Configuration Validation
  hosts: localhost
  gather_facts: false
  become: false
  
  tasks:
    - name: Test SSH connectivity to all hosts
      ansible.builtin.command: ssh -i ~/.ssh/ccdc_rsa -o BatchMode=yes -o ConnectTimeout=5 {{ ansible_user }}@{{ hostvars[item].ansible_host }} 'echo SUCCESS'
      register: ssh_test
      failed_when: false
      changed_when: false
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ item }}"
    
    - name: Calculate results
      ansible.builtin.set_fact:
        successful_hosts: "{{ ssh_test.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
        failed_hosts: "{{ ssh_test.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    
    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   AUDITD MONITORING COMPLETE             ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "Total hosts: {{ groups['all'] | length }}"
          - "✅ Successful: {{ successful_hosts | length }}"
          - "❌ Failed: {{ failed_hosts | length }}"
          - ""
          - "{{ 'Successful: ' ~ successful_hosts | join(', ') if successful_hosts else '' }}"
          - "{{ 'Failed: ' ~ failed_hosts | join(', ') if failed_hosts else '' }}"
          - ""
          - "Next steps:"
          - "  1. Monitor audit logs:"
          - "     ansible all -m command -a 'tail -50 /var/log/audit/audit.log' -b"
          - ""
          - "  2. Check loaded rules:"
          - "     ansible all -m command -a 'auditctl -l' -b"
          - ""
          - "  3. Search for specific events:"
          - "     ansible all -m command -a 'ausearch -k file_integrity' -b"
          - "     ansible all -m command -a 'ausearch -k privilege_escalation' -b"
          - ""
          - "  4. Generate audit report:"
          - "     ansible all -m command -a 'aureport --summary' -b"
          - ""
          - "  5. Create new VM snapshots: 'Post-Auditd-Monitoring'"
          - ""
          - "  6. Commit changes:"
          - "     git add -A"
          - "     git commit -m 'Sprint 3.3: Auditd monitoring complete'"
          - ""
          - "  7. Sprint 3 is COMPLETE! 🎉"
    
    - name: Fail if any hosts unreachable
      ansible.builtin.fail:
        msg: |
          ╔══════════════════════════════════════════╗
          ║   AUDITD MONITORING FAILED               ║
          ╚══════════════════════════════════════════╝
          
          Some hosts are unreachable after configuration!
          
          Failed hosts: {{ failed_hosts | join(', ') }}
          
          IMMEDIATE ACTION REQUIRED:
          
          1. Revert failed VMs to snapshot
          2. Check logs: ansible {{ failed_hosts[0] }} -m command -a "journalctl -u auditd -n 50" -b
          3. Test manually from VM console
      when: failed_hosts | length > 0
