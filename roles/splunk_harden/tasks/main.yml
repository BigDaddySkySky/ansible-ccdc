---
# Splunk hardening (Phase 2 safe)
# Goal: Do not break forwarder ingestion. No TLS receiver changes here.

- name: Ensure Splunk is running
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk status
  become: true
  become_user: splunk
  register: splunk_status
  changed_when: false
  failed_when: false

- name: Start Splunk if not running
  ansible.builtin.command:
    cmd: /opt/splunk/bin/splunk start --accept-license --answer-yes --no-prompt
  become: true
  become_user: splunk
  when: splunk_status.rc != 0
  changed_when: true

# Validate receiver port is still enabled and listening
- name: Verify receiver port 9997 is listening locally
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9997
    state: started
    delay: 2
    timeout: 60

# Optional: ensure management is reachable locally (do not force TLS changes here)
- name: Verify management port 8089 is listening locally
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 8089
    state: started
    delay: 2
    timeout: 60
