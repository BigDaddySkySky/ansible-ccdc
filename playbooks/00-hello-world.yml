---
- name: Hello World - SSH Validation
  hosts: all
  gather_facts: false

  tasks:
    - name: Validate SSH connectivity
      ansible.builtin.ping:
      register: ping_result

    - name: Display result
      ansible.builtin.debug:
        msg: "✅ {{ inventory_hostname }} is reachable!"
      when: ping_result is success

- name: Summary
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   SSH VALIDATION COMPLETE                ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "✅ All hosts reachable via SSH!"
