---
# Splunk Universal Forwarder package URLs (online install)
splunk_forwarder_deb_url: "https://download.splunk.com/products/universalforwarder/releases/9.1.1/linux/splunkforwarder-9.1.1-64e843ea36b1-linux-2.6-amd64.deb"
splunk_forwarder_rpm_url: "https://download.splunk.com/products/universalforwarder/releases/9.1.1/linux/splunkforwarder-9.1.1-64e843ea36b1.x86_64.rpm"

# Receiver configuration (preferred)
# Set these in inventory/group_vars day-of.
splunk_receiver_host: ""     # e.g. 172.20.x.y or hostname
splunk_receiver_port: 9997

# If the inventory contains a host alias named "splunk", we can auto-derive receiver host.
splunk_receiver_from_inventory: true

# Download behavior
splunk_forwarder_validate_certs: true
splunk_forwarder_local_pkg: ""   # optional: /tmp/splunkforwarder.rpm or .deb already on target

# Optional verbosity (kept off by default)
splunk_forwarder_verbose: false
