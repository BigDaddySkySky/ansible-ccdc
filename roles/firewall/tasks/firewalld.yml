---
# ============================================
# FIREWALLD CONFIGURATION (RHEL/Fedora)
# ============================================
# Critical-path safe:
# - Does NOT change default zone
# - Does NOT remove existing services/ports
# - Only configures firewalld if it's already running OR you explicitly opt-in to start it
# ============================================

- name: Install firewalld (Fedora/RHEL) via dnf CLI
  ansible.builtin.raw: dnf install -y firewalld
  become: true
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: Check firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state
  changed_when: false
  failed_when: false
  become: true

- name: Set firewalld_running fact
  ansible.builtin.set_fact:
    firewalld_running: "{{ (firewalld_state.stdout | default('')) == 'running' }}"

- name: Ensure firewalld is enabled and started (optional)
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true
  when: firewall_manage_firewalld_service | default(false) | bool

- name: Re-check firewalld state (post-start)
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state_after
  changed_when: false
  failed_when: false
  become: true
  when: firewall_manage_firewalld_service | default(false) | bool

- name: Update firewalld_running fact (post-start)
  ansible.builtin.set_fact:
    firewalld_running: "{{ (firewalld_state_after.stdout | default(firewalld_state.stdout | default(''))) == 'running' }}"
  when: firewall_manage_firewalld_service | default(false) | bool

- name: Skip firewalld configuration (service not running)
  ansible.builtin.debug:
    msg: "ℹ️ firewalld not running and firewall_manage_firewalld_service=false; skipping firewalld configuration"
  when:
    - not firewalld_running
    - not (firewall_manage_firewalld_service | default(false) | bool)

# ============================================
# Determine Effective Zone (do NOT change zones)
# ============================================

- name: Get default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: default_zone
  changed_when: false
  failed_when: false
  become: true
  when: firewalld_running

- name: Set effective zone fact
  ansible.builtin.set_fact:
    firewalld_effective_zone: "{{ default_zone.stdout | default(firewalld_default_zone) }}"
  when: firewalld_running

- name: Display effective zone
  ansible.builtin.debug:
    msg: "✅ Effective zone: {{ firewalld_effective_zone }}"
  when: firewalld_running

# ============================================
# Compute profile rules
# ============================================

- name: Assert firewall_profiles is valid
  ansible.builtin.assert:
    that:
      - firewall_profiles is mapping
      - "'baseline' in firewall_profiles"
    fail_msg: "firewall_profiles is missing or invalid (expected a dict with at least 'baseline')."
  changed_when: false
  when: firewalld_running

- name: Resolve firewall profile (strict)
  ansible.builtin.set_fact:
    firewall_profile_effective: "{{ firewall_profile | default('baseline') | trim }}"
  changed_when: false
  when: firewalld_running

- name: Debug firewall profile inputs
  ansible.builtin.debug:
    msg:
      - "firewall_profile={{ firewall_profile | default('UNDEF') }}"
      - "firewall_profile_effective={{ firewall_profile_effective | default('UNDEF') }}"
      - "firewall_profiles keys={{ firewall_profiles.keys() | list if firewall_profiles is mapping else 'NOT_A_MAPPING' }}"
      - "firewall_internal_cidrs={{ firewall_internal_cidrs | default([]) }}"
  when: firewalld_running

- name: Fail if firewall_profile is not defined in firewall_profiles
  ansible.builtin.fail:
    msg: >-
      firewall_profile='{{ firewall_profile_effective }}' is not present in firewall_profiles keys:
      {{ firewall_profiles.keys() | list }}
  when:
    - firewalld_running
    - firewall_profile_effective not in firewall_profiles

- name: Compute allowed service names for profile
  ansible.builtin.set_fact:
    firewall_allowed_service_names: "{{ firewall_profiles[firewall_profile_effective].allow_services | default([]) }}"
    firewall_profile_allow_ports: "{{ firewall_profiles[firewall_profile_effective].allow_ports | default([]) }}"
    firewall_profile_restrict_ports: "{{ firewall_profiles[firewall_profile_effective].restrict_ports | default([]) }}"
  changed_when: false
  when: firewalld_running

- name: Build allowed ports list from catalog + additional services
  ansible.builtin.set_fact:
    firewall_allowed_ports: >-
      {{
        (
          (firewall_scored_services | selectattr('name','in', firewall_allowed_service_names) | list)
          + (firewall_additional_services | default([]))
        )
      }}
  changed_when: false
  when: firewalld_running

- name: Display firewall profile summary
  ansible.builtin.debug:
    msg:
      - "🔥 Firewall profile: {{ firewall_profile_effective }}"
      - "✅ Allowed services: {{ firewall_allowed_service_names | join(', ') if firewall_allowed_service_names | length > 0 else '(none)' }}"
      - "🔒 Restricted ports: {{ firewall_profile_restrict_ports | map(attribute='port') | list | join(', ') if firewall_profile_restrict_ports | length > 0 else '(none)' }}"
  when: firewalld_running

# ============================================
# Allow profile ports (PUBLIC within zone)
# NOTE: Does NOT include restricted ports — those get rich rules below
# ============================================

- name: Allow profile ports (by port)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    port: "{{ item.port }}/{{ item.proto }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_allowed_ports }}"
  become: true
  when:
    - firewalld_running
    - firewall_allowed_ports | length > 0

# ============================================
# Restrict sensitive ports to internal CIDRs (Splunk profile)
# ============================================

- name: Allow restricted ports from internal CIDRs only (rich rules)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    rich_rule: >-
      rule family="ipv4"
      source address="{{ item.0 }}"
      port port="{{ item.1.port }}" protocol="{{ item.1.proto }}"
      accept
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_internal_cidrs | product(firewall_profile_restrict_ports) | list }}"
  become: true
  when:
    - firewalld_running
    - firewall_profile_restrict_ports | length > 0
    - firewall_internal_cidrs | length > 0

# (Optional) If you also want ipv6 internal handling, add separate v6 CIDRs + family="ipv6"

# ============================================
# Allow from Scoring Engine IPs (optional)
# ============================================

- name: Allow all traffic from scoring engine IPs (optional)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    source: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_scoring_ips }}"
  become: true
  when:
    - firewalld_running
    - firewall_allow_all_from_scoring_ips | bool
    - firewall_scoring_ips | length > 0

# ============================================
# Rate Limiting (optional)
# ============================================

- name: Enable SSH rate limiting with rich rule (optional)
  ansible.posix.firewalld:
    zone: "{{ firewalld_effective_zone }}"
    rich_rule: 'rule service name="ssh" limit value="{{ firewall_ssh_rate_limit }}" accept'
    state: enabled
    permanent: true
    immediate: true
  become: true
  when:
    - firewalld_running
    - firewall_enable_rate_limiting | bool

# ============================================
# Logging Configuration (optional)
# ============================================

- name: Configure firewalld logging (runtime)
  ansible.builtin.command: "firewall-cmd --set-log-denied={{ 'all' if firewall_log_denied else 'off' }}"
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  changed_when: true
  become: true

- name: Make firewalld logging configuration permanent
  ansible.builtin.command: "firewall-cmd --runtime-to-permanent"
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  changed_when: true
  become: true

- name: Reload firewalld to apply logging changes
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  when:
    - firewalld_running
    - firewall_enable_logging | bool
  become: true

# ============================================
# Verify Configuration
# ============================================

- name: Get firewalld configuration (effective zone)
  ansible.builtin.command: "firewall-cmd --zone={{ firewalld_effective_zone }} --list-all"
  register: firewalld_config
  changed_when: false
  failed_when: false
  become: true
  when: firewalld_running

- name: Display firewalld configuration summary
  ansible.builtin.debug:
    msg:
      - ""
      - "Firewalld configuration complete:"
      - "  • Running: {{ firewalld_running }}"
      - "  • Effective zone: {{ firewalld_effective_zone | default(firewalld_default_zone) }}"
      - "  • Profile: {{ firewall_profile_effective | default('baseline') }}"
      - "  • Allowed ports applied: {{ firewall_allowed_ports | length }}"
      - "  • Restricted ports applied: {{ firewall_profile_restrict_ports | length }}"
  when: firewalld_running
