---
# ============================================
# FIREWALL VALIDATION TASKS
# ============================================
# Verify firewall is active and configured correctly
# ============================================

- name: Check firewall status (UFW)
  ansible.builtin.command: "ufw status"
  register: ufw_validation
  changed_when: false
  failed_when: "'inactive' in ufw_validation.stdout"
  when: firewall_backend == "ufw"
  become: true

- name: Check firewall status (firewalld)
  ansible.builtin.command: "firewall-cmd --state"
  register: firewalld_validation
  changed_when: false
  failed_when: firewalld_validation.stdout != "running"
  when: firewall_backend == "firewalld"
  become: true

- name: Display firewall status
  ansible.builtin.debug:
    msg: "✅ Firewall is {{ 'ACTIVE' if firewall_backend == 'ufw' else 'RUNNING' }}"

- name: Verify SSH port is allowed (UFW)
  ansible.builtin.shell: "ufw status | grep -E '^22/tcp.*(ALLOW|LIMIT)'"
  register: ssh_check_ufw
  changed_when: false
  failed_when: ssh_check_ufw.rc != 0
  when: firewall_backend == "ufw"
  become: true

- name: Verify SSH port is allowed (firewalld)
  ansible.builtin.command: "firewall-cmd --zone={{ firewalld_default_zone }} --query-port=22/tcp"
  register: ssh_check_firewalld
  changed_when: false
  failed_when: ssh_check_firewalld.stdout != "yes"
  when: firewall_backend == "firewalld"
  become: true

- name: Display SSH validation
  ansible.builtin.debug:
    msg: "✅ SSH (port 22) is accessible"

- name: Test SSH connectivity from localhost
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    state: started
    delay: 0
    timeout: 10
  delegate_to: localhost
  become: false
  register: ssh_connectivity

- name: Display connectivity test result
  ansible.builtin.debug:
    msg: "{{ '✅ SSH connectivity confirmed' if ssh_connectivity is success else '❌ SSH connectivity failed' }}"

- name: Count allowed services/ports (UFW)
  ansible.builtin.shell: "ufw status numbered | grep -c ALLOW || echo '0'"
  register: ufw_allow_count
  changed_when: false
  when: firewall_backend == "ufw"
  become: true

- name: Count allowed services/ports (firewalld)
  ansible.builtin.shell: "firewall-cmd --zone={{ firewalld_default_zone }} --list-ports | wc -w"
  register: firewalld_allow_count
  changed_when: false
  when: firewall_backend == "firewalld"
  become: true

- name: Display service count
  ansible.builtin.debug:
    msg: "✅ Allowed services/ports: {{ ufw_allow_count.stdout if firewall_backend == 'ufw' else firewalld_allow_count.stdout }}"

- name: Final validation summary
  ansible.builtin.debug:
    msg:
      - ""
      - "╔══════════════════════════════════════════╗"
      - "║   FIREWALL VALIDATION COMPLETE           ║"
      - "╚══════════════════════════════════════════╝"
      - ""
      - "Firewall: {{ firewall_backend | upper }}"
      - "Status: {{ 'ACTIVE' if firewall_backend == 'ufw' else 'RUNNING' }}"
      - "SSH accessible: ✅"
      - "Allowed services: {{ ufw_allow_count.stdout if firewall_backend == 'ufw' else firewalld_allow_count.stdout }}"
      - ""
      - "⚠️  CRITICAL: Test all scored services immediately!"
      - ""
      - "Test commands from control node:"
      - "  curl http://{{ ansible_host }}         # HTTP"
      - "  curl https://{{ ansible_host }}        # HTTPS"
      - "  telnet {{ ansible_host }} 25           # SMTP"
      - "  telnet {{ ansible_host }} 110          # POP3"
      - "  ftp {{ ansible_host }}                 # FTP"
      - "  dig @{{ ansible_host }} example.com    # DNS"
