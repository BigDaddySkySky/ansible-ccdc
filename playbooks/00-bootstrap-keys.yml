# ============================================
# PLAYBOOK: BOOTSTRAP SSH KEYS (RANGE)
# ============================================

- name: Deploy SSH keys to SSH-capable hosts
  hosts: linux_servers:security_tools:unix_servers
  gather_facts: false
  become: false
  var_files:
    - group_vars/all/competition.yml

  tasks:
    - name: Display bootstrap target
      ansible.builtin.debug:
        msg: "Bootstrapping SSH key onto {{ inventory_hostname }} ({{ ansible_user }}@{{ ansible_host }})"

    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "~/.ssh"
        state: directory
        mode: "0700"

    - name: Deploy SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/ccdc_rsa.pub') }}"
        state: present

    - name: Confirm
      ansible.builtin.debug:
        msg: "✅ SSH key deployed to {{ inventory_hostname }}"

- name: Bootstrap Complete
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Display next steps
      ansible.builtin.debug:
        msg:
          - "✅ SSH key bootstrap complete."
          - ""
          - "Next:"
          - "1) Set private_key_file in ansible.cfg to your key (optional)"
          - "2) Test key auth: ansible -i inventory/range.ini linux_servers -m ping"
          - "3) If FreeBSD failed, root SSH login may be disabled—handle separately."
