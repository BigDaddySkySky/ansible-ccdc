---
# ============================================
# AUDITD INSTALLATION
# ============================================
# Install auditd and required plugins
# ============================================

- name: Install auditd (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ auditd_packages['Debian'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  register: auditd_apt
  become: true

- name: Install auditd packages (Fedora/RHEL) via dnf CLI
  ansible.builtin.raw: dnf install -y audit audit-libs
  become: true
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: Display installation result
  ansible.builtin.debug:
    msg: "{{ '✅ Auditd installed' if (auditd_apt is changed or auditd_dnf is changed) else '✅ Auditd already installed' }}"

- name: Ensure audit rules directory exists
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    mode: '0750'
    owner: root
    group: root
  become: true

- name: Display installation summary
  ansible.builtin.debug:
    msg:
      - "Auditd installation complete:"
      - "  • Packages: {{ auditd_packages[ansible_os_family] | join(', ') }}"
      - "  • Rules directory: /etc/audit/rules.d"
      - "  • Status: {{ 'Newly installed' if (auditd_apt is changed or auditd_dnf is changed) else 'Already present' }}"
