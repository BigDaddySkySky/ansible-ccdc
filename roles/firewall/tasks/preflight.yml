---
# ============================================
# FIREWALL PRE-FLIGHT CHECKS
# ============================================
# Verify prerequisites before configuring firewall
# ============================================

- name: Detect operating system family
  ansible.builtin.debug:
    msg: "OS Family: {{ ansible_os_family }}, Distribution: {{ ansible_distribution }}"

- name: Verify firewall backend is supported
  ansible.builtin.assert:
    that:
      - firewall_backend in ['ufw', 'firewalld']
    fail_msg: "Unsupported firewall backend: {{ firewall_backend }}"
    success_msg: "✅ Firewall backend: {{ firewall_backend }}"

- name: Check if UFW is available (Debian/Ubuntu)
  ansible.builtin.command: "which ufw"
  register: ufw_check
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Check if firewalld is available (RedHat/Fedora)
  ansible.builtin.command: "which firewall-cmd"
  register: firewalld_check
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: Display firewall availability
  ansible.builtin.debug:
    msg:
      - "Firewall availability:"
      - "{{ '  • UFW: ' ~ ('✅ Available' if ufw_check.rc == 0 else '❌ Not found') if ansible_os_family == 'Debian' else '' }}"
      - "{{ '  • firewalld: ' ~ ('✅ Available' if firewalld_check.rc == 0 else '❌ Not found') if ansible_os_family == 'RedHat' else '' }}"

- name: Warn about SSH connectivity
  ansible.builtin.debug:
    msg:
      - "⚠️  WARNING: Firewall changes may affect SSH connectivity!"
      - "   Ensure SSH (port 22) remains accessible."
      - "   Create VM snapshot before proceeding if not already done."

- name: Verify SSH service is in allowed list
  ansible.builtin.assert:
    that:
      - firewall_scored_services | selectattr('name', 'equalto', 'ssh') | list | length > 0
    fail_msg: "SSH is not in firewall_scored_services - this will lock you out!"
    success_msg: "✅ SSH will remain accessible"

- name: Check current SSH connection
  ansible.builtin.command: "echo 'SSH connection OK'"
  changed_when: false
  register: ssh_test

- name: Display SSH status
  ansible.builtin.debug:
    msg: "✅ Current SSH connection: {{ ansible_env.SSH_CONNECTION | default('Interactive') }}"

- name: Display pre-flight summary
  ansible.builtin.debug:
    msg:
      - "Pre-flight checks complete:"
      - "  • Firewall backend: {{ firewall_backend }}"
      - "  • OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "  • Services to allow: {{ firewall_scored_services | length }}"
      - "  • SSH protected: ✅"
