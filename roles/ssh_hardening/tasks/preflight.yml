---
# ============================================
# PRE-FLIGHT CHECKS
# ============================================
# Verify prerequisites before making changes
# ============================================

- name: Check if SSH service exists
  ansible.builtin.systemd:
    name: "{{ ssh_hardening_service_name }}"
  register: ssh_service_check
  failed_when: false
  check_mode: false

- name: Fail if SSH service not found
  ansible.builtin.fail:
    msg: "SSH service '{{ ssh_hardening_service_name }}' not found!"
  when: ssh_service_check.status is not defined

- name: Verify SSH is currently running
  ansible.builtin.systemd:
    name: "{{ ssh_hardening_service_name }}"
    state: started
  check_mode: true
  register: ssh_running
  failed_when: false

- name: Display SSH service status
  ansible.builtin.debug:
    msg: "{{ '✅' if ssh_running is success else '⚠️' }} SSH service: {{ 'Running' if ssh_running is success else 'NOT RUNNING' }}"

- name: Check if SSH config exists
  ansible.builtin.stat:
    path: "{{ ssh_hardening_config_path }}"
  register: sshd_config_stat
  become: true

- name: Fail if SSH config missing
  ansible.builtin.fail:
    msg: "SSH config not found at {{ ssh_hardening_config_path }}"
  when: not sshd_config_stat.stat.exists

- name: Backup original SSH config
  ansible.builtin.copy:
    src: "{{ ssh_hardening_config_path }}"
    dest: "{{ ssh_hardening_config_path }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: '0600'
  changed_when: false
  become: true

- name: Display backup location
  ansible.builtin.debug:
    msg: "✅ SSH config backed up to {{ ssh_hardening_config_path }}.backup.{{ ansible_date_time.epoch }}"

- name: Verify SSH key authentication is available
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: authorized_keys_check

- name: Warn if no authorized_keys found
  ansible.builtin.debug:
    msg:
      - "⚠️  WARNING: No authorized_keys file found!"
      - "   Path: /home/{{ ansible_user }}/.ssh/authorized_keys"
      - "   Without SSH keys, disabling password auth will lock you out!"
      - "   Run scripts/setup-ssh-keys.sh first!"
  when: not authorized_keys_check.stat.exists

- name: Fail if no SSH keys and forcing key-only auth
  ansible.builtin.fail:
    msg: "Cannot disable password authentication - no SSH keys installed!"
  when:
    - not authorized_keys_check.stat.exists
    - ssh_hardening_disable_password_auth | bool
    - not ssh_hardening_force_no_keys | bool

- name: Display pre-flight summary
  ansible.builtin.debug:
    msg:
      - "Pre-flight checks complete:"
      - "  • SSH service: {{ ssh_hardening_service_name }}"
      - "  • Config file: {{ ssh_hardening_config_path }}"
      - "  • Backup created: ✅"
      - "  • SSH keys present: {{ '✅' if authorized_keys_check.stat.exists else '❌' }}"
