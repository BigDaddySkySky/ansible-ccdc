# ============================================
# SSH HARDENING ROLE - HANDLERS
# ============================================
# Service restart handlers
# ============================================

- name: Restart sshd
  ansible.builtin.systemd:
    name: "{{ ssh_hardening_service_name }}"
    state: restarted
  listen: restart sshd
  become: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: restart fail2ban
  become: true

- name: Reload sshd
  ansible.builtin.systemd:
    name: "{{ ssh_hardening_service_name }}"
    state: reloaded
  listen: reload sshd
  become: true
