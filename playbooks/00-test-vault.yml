---
# ============================================
# VAULT DIAGNOSTIC PLAYBOOK
# ============================================
# Purpose: Debug vault variable loading issues
# Usage: ansible-playbook playbooks/00-test-vault.yml
# ============================================

- name: Test Vault Variable Loading
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display diagnostic header
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════╗"
          - "║   VAULT DIAGNOSTIC TEST                  ║"
          - "╚══════════════════════════════════════════╝"

    - name: Check if vault password file exists
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.vault_pass"
      register: vault_file

    - name: Display vault password file status
      ansible.builtin.debug:
        msg:
          - "Vault password file: {{ '✅ EXISTS' if vault_file.stat.exists else '❌ MISSING' }}"
          - "Path: {{ lookup('env', 'HOME') }}/.vault_pass"

    - name: Check ansible.cfg setting
      ansible.builtin.shell: grep vault_password_file ansible.cfg
      register: cfg_check
      changed_when: false
      failed_when: false

    - name: Display ansible.cfg vault setting
      ansible.builtin.debug:
        msg:
          - "ansible.cfg vault_password_file:"
          - "{{ cfg_check.stdout if cfg_check.rc == 0 else '❌ NOT CONFIGURED' }}"

    - name: Check if group_vars/all/vault.yml exists
      ansible.builtin.stat:
        path: group_vars/all/vault.yml
      register: global_vault

    - name: Display group vault status
      ansible.builtin.debug:
        msg: "group_vars/all/vault.yml: {{ '✅ EXISTS' if global_vault.stat.exists else '❌ MISSING' }}"

    - name: Check if group vault is encrypted
      ansible.builtin.shell: head -1 group_vars/all/vault.yml 2>/dev/null || echo "FILE_NOT_FOUND"
      register: vault_header
      changed_when: false

    - name: Display encryption status
      ansible.builtin.debug:
        msg:
          - "Encryption status:"
          - "{{ '✅ ENCRYPTED' if '$ANSIBLE_VAULT' in vault_header.stdout else '❌ NOT ENCRYPTED or MISSING' }}"
          - "First line: {{ vault_header.stdout[:50] }}"

    - name: Test vault decryption (global)
      ansible.builtin.shell: ansible-vault view group_vars/all/vault.yml
      register: decrypt_test
      changed_when: false
      failed_when: false

    - name: Display decryption test result
      ansible.builtin.debug:
        msg:
          - "Vault decryption test:"
          - "{{ '✅ SUCCESS' if decrypt_test.rc == 0 else '❌ FAILED' }}"
          - "{{ 'Error: ' + decrypt_test.stderr if decrypt_test.rc != 0 else 'Decryption works!' }}"

    - name: Try to access vault_default_password
      ansible.builtin.debug:
        var: vault_default_password
      failed_when: false
      register: var_test

    - name: Display variable access result
      ansible.builtin.debug:
        msg:
          - "Variable access test:"
          - "{{ '✅ vault_default_password = ' + vault_default_password if vault_default_password is defined else '❌ vault_default_password is UNDEFINED' }}"

    - name: Check host_vars directories
      ansible.builtin.shell: ls -la host_vars/*/vault.yml 2>/dev/null || echo "NO_HOST_VAULTS"
      register: host_vaults
      changed_when: false

    - name: Display host vault status
      ansible.builtin.debug:
        msg:
          - "Host-specific vault files:"
          - "{{ host_vaults.stdout_lines }}"

    - name: Final summary
      ansible.builtin.debug:
        msg:
          - ""
          - "╔══════════════════════════════════════════╗"
          - "║   DIAGNOSTIC SUMMARY                     ║"
          - "╚══════════════════════════════════════════╝"
          - ""
          - "If vault_default_password is UNDEFINED, check:"
          - "  1. group_vars/all/vault.yml exists and is encrypted"
          - "  2. ~/.vault_pass exists with correct password"
          - "  3. ansible.cfg has vault_password_file setting"
          - "  4. Vault file can be decrypted manually"
          - ""
          - "Common fixes:"
          - "  • ansible-vault view group_vars/all/vault.yml"
          - "  • ansible-vault decrypt group_vars/all/vault.yml (check content)"
          - "  • ansible-vault encrypt group_vars/all/vault.yml (re-encrypt)"

- name: Test Vault Loading with Inventory
  hosts: ubuntu_ecom_vm
  gather_facts: false

  tasks:
    - name: Test host-specific vault variable
      ansible.builtin.debug:
        msg:
          - "Testing host-specific vault for: {{ inventory_hostname }}"
          - "vault_host_password defined: {{ 'YES' if vault_host_password is defined else 'NO' }}"
          - "vault_default_password defined: {{ 'YES' if vault_default_password is defined else 'NO' }}"
          - "{{ 'vault_host_password = ' + vault_host_password[:4] + '***' if vault_host_password is defined else 'vault_host_password UNDEFINED' }}"
      failed_when: false
